  /v1/underwrite/analyses/{id}/report:
    get:
      operationId: getUnderwritingAnalysisReport
      summary: Download a statement evidence report (PDF or CSV)
      tags:
      - underwriting
      description: 'Returns the statement evidence behind an analysis as a downloadable document: a branded **PDF** (reconciliation, balances, and the labelled transaction table incl. counterparty roles) or a **CSV** of the labelled transactions for spreadsheet use.


        **`?format=pdf` (default) | `csv`.**


        Available only for statement-mode analyses (`POST /v1/underwrite/analyze/statement`) within the 7-day retention window. **404** for JSON-mode analyses (no statement evidence) or unknown ids; **410** once the evidence payload has been purged.


        Required scope: `underwriting:read`.'
      parameters:
      - schema:
          default: pdf
          anyOf:
          - type: string
            enum:
            - pdf
          - type: string
            enum:
            - csv
        in: query
        name: format
        required: false
        description: Output format. `pdf` (default) for the branded report, `csv` for the transaction rows.
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
        description: Server-assigned analysis id, as returned by POST /v1/underwrite/analyze.
      security:
      - bearerAuth: []
      responses:
