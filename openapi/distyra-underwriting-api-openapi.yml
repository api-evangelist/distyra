        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - application_ref
              properties:
                application_ref:
                  minLength: 1
                  maxLength: 200
                  description: Your reference for this borrower/application. Becomes the applicant_id on the resulting analysis so you can correlate the result.
                  type: string
                expires_in_days:
                  minimum: 1
                  maximum: 30
                  default: 7
                  description: How long the link stays openable before it auto-expires. Default 7.
