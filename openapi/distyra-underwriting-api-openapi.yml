  /v1/underwrite/analyses/{id}:
    get:
      operationId: getUnderwritingAnalysis
      summary: Re-fetch a previous underwriting analysis (7-day window)
      tags:
      - underwriting
      description: 'Returns the original features payload within the 7-day retention window after analyze. Useful when the lender system needs to re-pull after a network drop or page refresh.


        **410 Gone** after `features_purged_at` is set (or `features_returned` is null). The analysis row stays for billing audit but the payload cannot be re-fetched. Lenders should persist results their side if they need long-term access.


        **404 Not Found** when no row exists for your organization. Scoped to your organization; a uuid belonging to another organization returns 404 (no information leakage).


        Required scope: `underwriting:read`.'
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
        description: Server-assigned analysis id, as returned by POST /v1/underwrite/analyze.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 200 response from POST /v1/underwrite/analyze. The features payload is retained for 7 days for re-fetch on network drop, then purged. The analysis row itself stays for billing audit.
          content:
            application/json:
              schema:
                description: 200 response from POST /v1/underwrite/analyze. The features payload is retained for 7 days for re-fetch on network drop, then purged. The analysis row itself stays for billing audit.
                type: object
                required:
                - id
                - applicant_id
                - applicant_type
                - analysis_window
                - features
                - engine_versions
                - billable
                - available_until
                properties:
                  id:
                    format: uuid
                    description: Server-assigned analysis id. Use with GET /v1/underwrite/analyses/:id to re-fetch within the 7-day retention window.
                    type: string
                  applicant_id:
                    description: Echoes the request `applicant_id` for client correlation.
                    type: string
                  applicant_type:
                    description: Echoes the applicant type this analysis ran under, so the response is self-describing for your audit record. 'business' when the request omitted it.
                    anyOf:
                    - type: string
                      enum:
                      - business
                    - type: string
                      enum:
                      - consumer
                    example: business
                  special_category_suppressed_count:
                    description: '**Consumer applicants only.** Absent under `applicant_type: business`, where the layer does not run.


                      How many transactions had their merchant resolution collapsed because resolving them would have been an inference about health, religion or belief, political opinion, trade-union membership or ethnic origin (GDPR Article 9(1)), or gambling (tracked separately, and not Article 9).


                      Those transactions are still in the analysis and still count toward every figure: amount, date, direction and cadence are legitimate affordability signals and are retained. What is withheld is the merchant identity, industry, logo, merchant-derived counterparty role and IBAN, and each such transaction is marked `special_category_suppressed: true` in the evidence package.


                      **Per-category counts are deliberately not provided.** "3 health, 1 religion" about one applicant is itself an Article 9 disclosure at small counts. This single number lets you evidence that the control ran without learning what it caught.


                      Suppression is not overridable: there is no flag, parameter or header that turns it off for a consumer applicant. See CCD2 Article 18(3), which prohibits special-category data in a creditworthiness assessment outright from 20 November 2026.'
                    type: integer
                    example: 4
                  analysis_window:
                    description: 'Resolved window: either the requested window or the auto-detected min/max from the transaction stream.'
                    type: object
                    required:
                    - start
                    - end
                    properties:
                      start:
                        format: date
                        type: string
                      end:
                        format: date
                        type: string
                  features:
                    additionalProperties: true
                    description: 'Computed feature bundle: `aggregation` (turnover, cash_position, customer_concentration, credit_line_utilization, the last of which is null unless an account declares a committed limit; customer_concentration.inferred_inflows lists inflows that were counted toward the concentration figures despite carrying a role that normally excludes them (supplier, employee, payment_processor, lender, tax_authority, internal_transfer), because that role was guessed rather than established. Each row names the role it would have been excluded as and why the evidence was insufficient. A curated role still excludes and is not listed. The bucket exists because excluding on a guess let an AI-supplied merchant category move top1_pct and hhi; it is empty when there is nothing to report), `recurring` (recurring_revenue, recurring_expense, returned_dd counts), `counterparty` (tax_payments, statutory_contributions, debt_service, supplier_payments, payment-regularity streams over supplier-tagged counterparties; suppliers_tagged=0 means no supplier coverage for this applicant, not "pays nobody"; debt_collection, payments to debt-collection agencies, an adverse signal; collectors_tagged=0 = no collector activity; only collectors whose role is established count toward `payments`, `collectors_tagged` and `total_micros`; one we only infer is listed in `debt_collection.inferred_collections` with its reason instead, so an adverse inference is never reported as established fact, the same treatment `irregular_credit_payments` gives a guessed lender, and note the direction is deliberately opposite to `customer_concentration.inferred_inflows`, where a guess is counted because excluding it would understate risk; irregular_credit_payments, outflows to credit providers that were not counted as debt_service. Three reasons, carried per row: `not_cadenced` (too irregular to establish a schedule), `inferred_provenance` (the only evidence the counterparty is a lender is an AI inference), and `no_debt_evidence` (the counterparty is an established credit provider and the payments are regular, but nothing about the payments says they are payments on a debt, such as the monthly account fee). These amounts remain in debt_capacity.monthly_non_debt_outflows_micros, so they are counted exactly once; the bucket exists so an analyst can see credit-related spending the engine declined to call an obligation. counterparties=0 = nothing uncounted. Correspondingly, each debt_service stream carries `debt_evidence` naming what established it: `purpose_code` (an ISO 20022 repayment code declared by the applicant''s own bank), `descriptor_keyword` (a locale repayment term in the raw descriptor) or `material_cadenced_stream` (a cadenced amount above the account-fee floor, the weakest of the three and the one that says only that the payment is too large to be a bank charge)), `debt_capacity` (DSCR + capacity at policy thresholds, with a transparent assumptions block), `anomaly` (null; Engine 4 deferred). **Under `applicant_type: consumer` the bundle also carries `income` and `income_corroboration`, and omits `turnover`, `customer_concentration`, `credit_line_utilization`, `statutory_contributions` and `debt_capacity` rather than nulling them** (a consumer `turnover` of 0 would read as "this applicant earns nothing"). `income` gives per-stream source types (employment / benefits / pension / self_employment / rental / other), a monthly total, a breakdown, stability (amount variation and missed occurrences, because a skipped salary run is invisible to the variation alone), source concentration, and months observed. Two properties of the breakdown are worth relying on: it always sums to `monthly_income_micros`, and a named bucket is only ever credited from an established role. A source type resting on an AI-supplied merchant category still labels its stream, with `source_type_source: inferred`, but its money lands in `unattributed`, so no model can move a figure between the named buckets. Correspondingly a guessed `lender` role cannot drop an inflow from income: it is counted and disclosed in `income.inferred_inflows`, because letting a model lower an applicant''s income is the wrongful-decline direction. `income_corroboration` is present only when you supplied `declared_monthly_income`, and is null (not absent) when you did not. `committed_expenditure` groups the recurring outflow streams into categories (housing, utilities, insurance, credit, childcare, alimony, education, tax, other_committed, plus `unattributed`), gives a monthly committed total, an explicit discretionary residual, each credit obligation broken out individually, and the returned-direct-debit count. Two definitions to read before using it. **Committed means recurring, not contractually obliged.** A monthly subscription counts, because deciding which recurring costs an applicant could stop paying is a judgment about their life rather than a fact about their statements; the effect is conservative for residual income and you can rebuild a narrower definition from `categories` and `credit_commitments`. And **discretionary is a residual, never a classification**: nothing is labelled discretionary, so that figure absorbs one-off purchases, cash withdrawals and every outflow too irregular to form a stream. `credit_commitments` is derived from `counterparty.debt_service` rather than recomputed, so the two lists are one fact seen twice and cannot disagree; `uncounted_credit_monthly_micros` tells you when `counterparty.irregular_credit_payments` holds credit-related outflow the engine declined to call an obligation. `affordability` is the consumer analogue of `debt_capacity`: residual income as the headline (income minus committed, in euros rather than a ratio, because 30% of 1,400 and 30% of 6,000 are the same number and not the same situation), plus `debt_to_income_ratio` and `debt_service_to_income_ratio` (credit plus housing). **It publishes no threshold ladder on purpose.** Consumer affordability norms are set per market by regulation and per lender by policy, and inventing one would dress our choice as a standard. `household` is echoed there exactly as you supplied it and is read by nothing; it is never inferred. **Both ratios are a floor whenever `committed_expenditure.categories.unattributed.monthly_micros` is non-zero**, because a commitment whose category rests on an AI-supplied merchant category is not credited to a named bucket. The `assumptions.ratio_basis` string says which case applies on each analysis. Note the total and therefore `residual_income_micros` are unaffected either way. `counterparty.tax_payments` and `counterparty.statutory_contributions` carry established roles only: a public body recognised solely from an AI-supplied category is diverted to `counterparty.inferred_tax_payments` / `counterparty.inferred_statutory_contributions` with its reason, rather than appearing in the primary list with a label. No figure moves when a row diverts, because these buckets feed no capacity calculation; what changes is that a statement of fact to you is no longer made on a guess. Amount fields are stringified micro-EUR bigints so 12-digit values round-trip cleanly through JSON.'
                    type: object
                    properties: {}
                  engine_versions:
                    description: Per-engine semver. Bump on each engine update so downstream consumers can pin or invalidate cached results.
                    type: object
                    required:
                    - aggregation
                    - recurring
                    - counterparty
                    - debt_capacity
                    - income
                    - committed_expenditure
                    - affordability
                    - anomaly
                    properties:
                      aggregation:
                        type: string
                        example: 1.0.0
                      recurring:
                        type: string
                        example: 1.0.0
                      counterparty:
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: 1.0.0
                      debt_capacity:
                        description: 'Derived feature layer (DSCR + capacity). **Null under `applicant_type: consumer`**, where the engine does not run: DSCR presumes a business servicing debt from trading cash flow. Null means "did not run", which is a different statement from a version string. The consumer analogue is a residual-income and debt-to-income layer, not yet shipped.'
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: 1.2.0
                      income:
                        description: 'Consumer income layer (`features.income`, `features.income_corroboration`). **Null under `applicant_type: business`**, mirroring `debt_capacity` in the other direction: the two are analogues and each is null on the profile where it did not run. The business analogue of income is `turnover`.'
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: 1.0.0
                      committed_expenditure:
                        description: 'Consumer committed-expenditure layer (`features.committed_expenditure`). Null under `applicant_type: business`.'
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: 1.0.0
                      affordability:
                        description: 'Consumer affordability layer (`features.affordability`). Null under `applicant_type: business`; it is the analogue of `debt_capacity`, which is null under `consumer`.'
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: 1.0.0
                      anomaly:
                        description: Null in v1. Engine 4 (structuring + transaction anomaly) is deferred to v2.
                        anyOf:
                        - type: string
                        - type: 'null'
                        example: null
                  evidence:
                    description: 'Transaction-level evidence behind the features: labelled transactions (incl. counterparty_role), balances, the reconciliation trust artifact, parser warnings, and source provenance. Present on /analyze/statement responses only.'
                    type: object
                    required:
                    - reconciled
                    - accounts
                    - warnings
                    - sources
                    properties:
                      reconciled:
                        description: True iff every account balances within tolerance (opening + transactions = closing).
                        type: boolean
                      accounts:
                        type: array
                        items:
                          type: object
                          required:
                          - account_id
                          - iban
                          - iban_source
                          - currency
                          - opening_balance_micros
                          - closing_balance_micros
                          - available_balance_micros
                          - committed_limit_micros
                          - statement_period
                          - reconciliation
                          - transactions
                          properties:
                            account_id:
                              type: string
                            iban:
                              anyOf:
                              - type: string
                              - type: 'null'
                            iban_source:
                              description: 'Where `iban` came from, so you can weigh it. Null when, and only when, there is no IBAN.


                                - `received`: **we read it off the statement.** CAMT.053 and CODA always carry one; MT940 usually does; a PDF carries whatever is printed on it, and a misread one is caught by its own ISO 7064 check digits.

                                - `derived`: **the format carries no IBAN and we reconstructed it** from the domestic account components. Norma 43 (Spain) is the case today: the two dígitos de control the Spanish IBAN needs are a weighted mod-11 of the entidad, oficina and cuenta the file already carries, so the IBAN is a function of fields we read rather than data the file omits.

                                - `client_asserted`: **you sent it to us.** Every account submitted to `POST /v1/underwrite/analyze/statement/parsed` carries this, because on that route your browser ran the parser and the PDF never reached us, so we did not read the statement and did not compute anything. We do not repeat a provenance claim we cannot check: whatever the submitted body said about this field is discarded and replaced with this value.


                                **Why this is published rather than kept internal.** A derived IBAN **cannot be checked against anything the bank sent**. Its check digits are computed from the same fields we read, so a field taken at the wrong offset produces a self-consistent IBAN for an account that does not exist, and no validation downstream can see it. A `received` IBAN has the opposite property: somebody else computed its check digits, so they test our reading. `client_asserted` is a third thing again, carrying no claim by us at all. If you reconcile this account number against another system, that difference is the thing to weigh.'
                              anyOf:
                              - type: string
                                enum:
                                - received
                              - type: string
                                enum:
                                - derived
                              - type: string
                                enum:
                                - client_asserted
                              - type: 'null'
                              example: received
                            currency:
                              type: string
                            opening_balance_micros:
                              type: string
                            closing_balance_micros:
                              type: string
                            available_balance_micros:
                              anyOf:
                              - type: string
                              - type: 'null'
                            committed_limit_micros:
                              anyOf:
                              - type: string
                              - type: 'null'
                            statement_period:
                              type: object
                              required:
                              - start
                              - end
                              properties:
                                start:
                                  type: string
                                end:
                                  type: string
                            reconciliation:
                              type: object
                              required:
                              - account_id
                              - iban
                              - reconciled
                              - opening_balance_micros
                              - closing_balance_micros
                              - transaction_sum_micros
                              - expected_delta_micros
                              - residual_micros
                              - tolerance_micros
                              properties:
                                account_id:
                                  type: string
                                iban:
                                  anyOf:
                                  - type: string
                                  - type: 'null'
                                reconciled:
                                  type: boolean
                                opening_balance_micros:
                                  type: string
                                closing_balance_micros:
                                  type: string
                                transaction_sum_micros:
                                  type: string
                                expected_delta_micros:
                                  type: string
                                residual_micros:
                                  description: expected_delta - transaction_sum. "0" on a perfectly balanced statement; non-zero flags a dropped/misparsed transaction.
                                  type: string
                                tolerance_micros:
                                  description: Allowed |residual|. "0" for structured formats; calibrated (1 cent/txn, €1 cap) for PDF.
                                  type: string
                            transactions:
                              type: array
                              items:
                                additionalProperties: true
                                type: object
                                required:
                                - id
                                - date
                                - amount_micros
                                - currency
                                - descriptor_raw
                                - descriptor_cleaned
                                - merchant_id
                                - merchant_industry
                                - merchant_subindustry
                                - merchant_statutory_kind
                                - transaction_type
                                - is_transfer
                                - is_bank_internal
                                - counterparty_iban
                                - counterparty_role
                                properties:
                                  id:
                                    type: string
                                  date:
                                    format: date
                                    type: string
                                  amount_micros:
                                    type: string
                                  currency:
                                    type: string
                                  descriptor_raw:
                                    description: Null only on a special-category-suppressed transaction (see `special_category_suppressed`), where the raw descriptor is withheld because it is the merchant identity in its least processed form. Always a string otherwise.
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  descriptor_cleaned:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  merchant_id:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  merchant_industry:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  merchant_subindustry:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  merchant_statutory_kind:
                                    description: health / pension / accident / sectoral / social_secretariat / social_security / other / null. Set only for statutory bodies (drives the statutory_contributions split); null for everything else, including genuine tax authorities.
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  transaction_type:
                                    type: string
                                  is_transfer:
                                    type: boolean
                                  is_bank_internal:
                                    type: boolean
                                  counterparty_iban:
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  counterparty_role:
                                    description: The EU-correctness signal. Functional role of the counterparty, or null when untagged. **Business:** tax_authority, lender, customer, supplier, employee, payment_processor, internal_transfer. **Consumer (added 2026-08-12):** employer, benefits_agency, pension_provider, landlord, mortgage_provider, utility, insurer, childcare, alimony_recipient, education. Every value names a payer, never a reason for payment. No role discloses a special category, which is why a suppressed transaction keeps its role. `benefits_agency` and `pension_provider` are deliberately separable from `employer`, and `mortgage_provider` from `lender`, because some lenders may not count benefits toward affordability and housing cost is treated differently from unsecured credit.
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                  special_category_suppressed:
                                    description: '**Consumer applicants only.** True when this transaction''s merchant resolution was collapsed under GDPR Article 9 / CCD2 Article 18(3). See `special_category_suppressed_count` at the top level.


                                      Read it as "we resolved this and are not telling you", which is a different statement from the null merchant fields on an ordinary unresolved transaction. Amount, date, direction and cadence are intact and the transaction still counts toward every figure; `descriptor_raw`, `descriptor_cleaned`, `merchant_id`, `merchant_industry`, `merchant_subindustry`, the merchant-derived `counterparty_role` and `counterparty_iban` are withheld.


                                      Absent (not false) on every other transaction and on the whole business path.'
                                    type: boolean
                                  counterparty_source:
                                    description: 'Provenance of an institutional counterparty_role / merchant_statutory_kind: ''confirmed'' (curated catalog row or payer-declared ISO 20022 purpose code) vs ''inferred'' (AI category guess). Lets a lender tell a solid obligation from a likely one; inferred rows still count in the totals. Absent on regular merchants.'
                                    anyOf:
                                    - type: string
                                      enum:
                                      - confirmed
                                    - type: string
                                      enum:
                                      - inferred
                                    - type: 'null'
                                  debt_purpose_code:
                                    description: 'Payer-declared ISO 20022 purpose code, restricted to the debt-repayment codes: LOAR (loan repayment), HLRP / HLST (property loan), CLPR (car loan principal), IHRP (instalment / hire purchase), REOD (overdraft repayment), BKPP (bank loan principal paydown), INTE (interest). Null on every transaction that does not declare one, and on the drawdown codes (LOAN, PLDS, BKDF), the refinancing code (PLRF) and the loan-FEE code (BKFE), none of which is a payment on a debt. This is the strongest of the three signals behind `counterparty.debt_service.debt_evidence`: it comes from the statement rather than from our catalog. Populated automatically from CAMT.053 `<Purp><Cd>`; no other statement format carries a true ISO purpose code.'
                                    anyOf:
                                    - type: string
                                    - type: 'null'
                                    example: LOAR
                      warnings:
                        type: array
                        items:
                          type: object
                          required:
                          - code
                          - message
                          - location
                          properties:
                            code:
                              type: string
                            message:
                              type: string
                            location:
                              type: string
                      sources:
                        type: array
                        items:
                          type: object
                          required:
                          - format
                          - parser_version
                          - bytes_in
                          - txn_count_parsed
                          - txn_count_dropped
                          - extraction_method
                          - completeness
                          properties:
                            format:
                              type: string
                            parser_version:
                              type: string
                            bytes_in:
                              type: number
                            txn_count_parsed:
                              type: number
                            txn_count_dropped:
                              type: number
                            extraction_method:
                              description: 'How the transactions were obtained from this source. **Weigh the output accordingly**: `structured` (CAMT.053, MT940 and the rest) and `deterministic_pdf` / `deterministic_pdf_browser` are rule-based parsers with no model involved. `llm_ocr` is the document-model fallback, used when the deterministic parser cannot read a layout.


                                Provided so that the person your organisation assigns to oversee this output under AI Act Article 26(2) can tell which of those produced the numbers, which is a different question from whether they balance.'
                              type: string
                              example: deterministic_pdf
                            completeness:
                              description: 'Whether the extraction was checked against the **control totals the statement declares for itself** (opening + total in − total out = closing).


                                - `verified`: the statement declared usable totals, they were self-consistent, and they equal what we extracted. The strongest assurance available that no row is missing.

                                - `unverified_no_control_totals`: the statement declares no usable totals. Common, and not a defect.

                                - `unverified_totals_inconsistent`: totals were found but failed their own identity, so they describe something other than this transaction list. Discarded rather than trusted.

                                - `unverified_rows_filtered`: we excluded rows, for example non-EUR transactions or entries that would be counted twice, so a disagreement would prove nothing.

                                - `unverified_descriptor_integrity`: the extraction''s descriptors collapsed to one or two distinct values across a long statement, so merchant resolution and counterparty grouping cannot be trusted even though every figure reconciles. Reported rather than fatal, because low diversity has a legitimate shape (a card used at one shop); an extraction with no descriptors at all is refused outright instead.

                                - `unverified_descriptor_provenance`: descriptors were returned that do not appear in the text the extractor actually read, so they were produced rather than transcribed off the statement. **This is the only check that can see a descriptor which is present, plausible and wrong.** Every other one is arithmetic, and an invented descriptor changes no total. Reported rather than fatal: measured at 0 ungrounded rows across 630 rows of real statements, so the false-positive rate is bounded but the check is young. Absent only when the extraction route supplies no source text, in which case the question could not be asked and no verdict is claimed either way.

                                - `unverified_amount_provenance`: amounts were returned that do not appear in the transaction table the extractor read from the page, so at least one figure was not read off the statement. **This is the only check that is not arithmetic**, and therefore the only one that can see two amounts misread in compensating directions: those preserve every total, so both the balance reconciliation and the statement''s own declared totals accept them. Absent when the page carries no parseable transaction table.

                                - `unverified_ocr_fidelity`: descriptors were read consistently by the document model but do not appear in the PDF''s own embedded text. **This is the only check sourced from a reading that is not OCR**, and therefore the only one that can see a stable misread: an engine reading the same wrong characters on every run produces a page text and an annotation that agree with each other, so re-running it proves nothing. Divergence is reported only for a near-miss of a real word in a character pair OCR genuinely confuses, which is what keeps rendering differences between the two readings from being reported as defects. Absent when the document carries no usable text layer.

                                - `unverified_ocr_fidelity` is also set when an account number in a descriptor **fails its own ISO 7064 check digits**. A correctly transcribed IBAN always passes, so a failure means a character was misread. This half of the signal needs no second reading of the page at all, which makes it the one fidelity check that still works on a document with no usable text layer. Mandate references and domestic account ids are excluded by construction: a known country code printed at the wrong length for that country is never treated as an IBAN.

                                - `unverified_date_integrity` is also set when a transaction''s **amount is printed on the page against a different date** than the one reported. The amounts themselves are all present, so every total is preserved and neither balance reconciliation nor the declared control totals can see it. This pairs each amount with the date printed beside it in the statement''s own table, so it needs no second extraction.

                                - `unverified_extraction_reproducibility`: the same document extracted more than once did not return the same transaction set. **This is the only check that does not compare the extraction against the page**, so it is the only one that can see an output which is internally consistent, grounded in the page text and arithmetically sound while simply not being reproducible. It says nothing about which run is correct; the result returned is the most common one. Absent unless repeated extraction is enabled, in which case no claim is made either way.

                                - `unverified_amount_provenance` is also set when a **declared balance or control total does not appear anywhere on the page it was read from**. Both existing balance checks are internal: one compares the transaction sum to the declared opening-to-closing delta, the other checks the four declared figures against their own identity. A misread balance that stays self-consistent passes them both, and only a comparison against the page can see it.

                                - `unverified_date_integrity`: transaction dates are not in chronological order, which suggests a row was extracted with the wrong date. **This outranks every value above, including `verified`**, because the others describe whether we could check the extraction while this is evidence the extraction is wrong. A misread date preserves every total, so neither the balance check nor the control totals can see it. It is reported rather than fatal: statements are overwhelmingly chronological (12 of 12 measured), but a bank that groups by transaction type or orders by value date would trip it legitimately.


                                **Treat anything other than `verified` as "we do not know whether the extraction is complete and faithful."**


                                Two things this check is for, both measured rather than assumed. **Missing rows:** an extraction is now accepted only if it reconciles against the statement''s own declared closing balance, so a missing row is rejected outright rather than surfacing here. The earlier weakness, where a single dropped transaction was silently accepted in most positions on a long statement, was closed on 2026-08-17. **Wrong dates:** reconciliation cannot see an error that preserves the totals, and a transaction placed on the wrong day does exactly that. It was observed twice in 55 real extractions, on two different statements. `unverified_date_integrity` is the only signal that reports it.'
                              type: string
                              example: verified
                  billable:
                    description: true when this call consumed quota / triggered a debit. false on 7-day idempotent re-pull (same applicant_id, returns the original result) and on calls within the Starter tier's 50 included applicants.
                    type: boolean
                  available_until:
                    format: date-time
                    description: +7-day re-fetch deadline. After this timestamp the features payload is purged by the retention cron; GET /v1/underwrite/analyses/:id returns 410 thereafter.
                    type: string
        '401':
          description: Standard error envelope used for all non-2xx responses.
          content:
            application/json:
              schema:
                description: Standard error envelope used for all non-2xx responses.
                type: object
                required:
                - error
                properties:
                  error:
                    description: Stable machine-readable code. SDK consumers should switch on this.
                    type: string
                    example: invalid_key
                  detail:
                    description: Free-form human-readable explanation. Safe to surface.
                    type: string
                  request_id:
                    description: Server-generated request id (also returned as the X-Request-Id header). Quote it when contacting support to correlate a failed call with server logs. Present on errors surfaced by the global error handler.
                    type: string
                  scope:
                    description: '429 only. Which window tripped: `burst` (per-second) or `sustained` (per-minute average).'
                    anyOf:
                    - type: string
                      enum:
                      - burst
                    - type: string
                      enum:
