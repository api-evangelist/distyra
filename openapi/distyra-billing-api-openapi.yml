  /v1/billing/payments/{paymentId}:
    get:
      operationId: getBillingPayment
      summary: Live Mollie state for one of the org’s payments
      tags:
      - Billing
      description: 'Returns a reconciliation projection of the Mollie payment behind a ledger

        entry or invoice: status, method, settlement, refund/chargeback totals, and

        the payment''s own dashboard deep-link. First-party only (service principal).


        **404** if the payment id is not one of this org’s payments.


        Required scope: `enrichment:read`.'
      parameters:
      - schema:
          pattern: ^tr_[A-Za-z0-9]+$
          type: string
        in: path
        name: paymentId
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - method
                - sequenceType
                - amount
                - settlementAmount
                - amountRefunded
                - amountChargedBack
                - isRefunded
                - isChargedBack
                - createdAt
                - paidAt
                - dashboardUrl
                properties:
                  id:
                    type: string
                  status:
                    type: string
                  method:
                    anyOf:
                    - type: string
                    - type: 'null'
                  sequenceType:
                    anyOf:
                    - type: string
                    - type: 'null'
                  amount:
                    type: object
                    required:
                    - value
                    - currency
                    properties:
                      value:
                        type: string
                      currency:
                        type: string
                  settlementAmount:
                    anyOf:
                    - type: object
                      required:
                      - value
                      - currency
                      properties:
                        value:
                          type: string
                        currency:
                          type: string
                    - type: 'null'
                  amountRefunded:
                    anyOf:
                    - type: object
                      required:
                      - value
                      - currency
                      properties:
                        value:
                          type: string
                        currency:
                          type: string
                    - type: 'null'
                  amountChargedBack:
                    anyOf:
                    - type: object
                      required:
                      - value
                      - currency
                      properties:
                        value:
                          type: string
                        currency:
                          type: string
                    - type: 'null'
                  isRefunded:
                    type: boolean
                  isChargedBack:
                    type: boolean
                  createdAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  paidAt:
                    anyOf:
                    - type: string
                    - type: 'null'
                  dashboardUrl:
                    anyOf:
                    - type: string
                    - type: 'null'
        '401':
          description: Standard error envelope used for all non-2xx responses.
          content:
