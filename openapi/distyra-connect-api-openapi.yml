    delete:
      operationId: revokeConnection
      summary: Revoke a bank connection
      tags:
      - Connect
      description: 'Ends the connection and withdraws the bank consent behind it. Idempotent: revoking an already-revoked connection succeeds. An `own` or `end_user` connection is billed a month at a time from the day it activated, not by calendar month. Revoking stops the next month being charged; the month already started is not refunded.


        **Cleaning up attempts that never finished.** Send `expected_status=pending` and the connection is ended only while it is still pending. If the account holder finished authorizing first, the call answers 409 `connection_not_pending` and changes nothing, so an automated sweep cannot end a connection that has just succeeded. Use it for that sweep, because a hosted link bounds only when a flow may **start**, not when it may finish: an authorization begun before the link expired can still complete after it, so the link''s `expires_at` is not a safe cleanup threshold on its own. Measure age from the connection''s `created_at`, which is when the authorization began, instead.


        **Required scope:** `connect:write`.'
      parameters:
      - schema:
          enum:
          - pending
          type: string
        in: query
        name: expected_status
        required: false
        description: 'Precondition. With `pending`, revoke only while the connection is still pending: 409 if the account holder has already authorized (`active`), or did and the consent has since lapsed (`expired`). A connection that is already `revoked`, or that failed at the bank (`error`), answers 204, so retrying a call that succeeded is safe. Omit to revoke whatever state the connection is in.'
