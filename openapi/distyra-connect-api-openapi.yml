                                  - BE
                                - type: string
                                  enum:
                                  - RF
                              reference:
                                description: 'Compact form: 12 digits for `BE`, uppercase with no spaces for `RF`.'
                                type: string
                              formatted:
                                description: As printed on an invoice, for example `+++090/9337/55493+++`.
                                type: string
                              source:
                                description: Where it was found.
                                anyOf:
                                - type: string
                                  enum:
                                  - reference_number
                                - type: string
                                  enum:
                                  - remittance_information
                          - type: 'null'
                        credit_debit:
                          anyOf:
                          - type: string
                            enum:
                            - CRDT
                          - type: string
                            enum:
                            - DBIT
                          - type: 'null'
                        status:
                          description: 'The entry''s status as Enable Banking reports it: `BOOK` (booked), `PDNG` (pending), `CNCL` (cancelled), `HOLD` (account hold), `RJCT` (rejected), `SCHD` (scheduled) or `OTHR` (unknown). Only `BOOK` means booked, so post to a ledger on `BOOK` alone. Enable Banking requires a status on every entry; if one were ever missing this is null, which is not booked either.'
                          anyOf:
                          - type: string
                          - type: 'null'
