  /v1/underwrite/analyze/statement/async:
    post:
      operationId: analyzeApplicantFromStatementAsync
      summary: Submit a PDF bank statement for background underwriting analysis
      tags:
      - underwriting
      description: 'Asynchronous, submit-then-poll variant of `POST /v1/underwrite/analyze/statement` for **PDF** statements, whose LLM-backed extraction can exceed the edge request ceiling. Returns `202` with a job id; poll `GET /v1/underwrite/analyze/statement/async/{id}` until `status` is `completed` (or `failed`), then read `result` (the same response shape as the synchronous endpoint). You can also subscribe to the `analysis.completed` webhook event.


        **PDF only.** Structured formats (CAMT.053 / MT940 / CFONB 120 / CODA / Norma 43 / CBI / BGMAX) parse synchronously in milliseconds. Submit those to `POST /v1/underwrite/analyze/statement` and read the result inline. A non-PDF submission here returns `415`.


        **Multipart shape:** identical to the synchronous endpoint (`meta` JSON text part with `input_mode: "statement_pdf"` + one or more PDF file parts). `?enrich=true` is honoured the same way.


        **Billing.** Charged when the background analysis runs (identical bundle to the synchronous path), not at submission. A PDF that fails to parse is not billed. Result + status retained 7 days.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - meta
              - files
              properties:
                meta:
                  type: string
                  description: 'JSON-encoded object, sent as a text part named exactly `meta`: `{ "applicant_id": string, "input_mode": "statement_camt053" | "statement_mt940" | "statement_cfonb120" | "statement_coda" | "statement_norma43" | "statement_cbi" | "statement_bgmax" | "statement_pdf", "applicant_type"?: "business" | "consumer", "analysis_window"?: { "start": string, "end": string } }`.'
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                    description: One statement file in the format declared by `meta.input_mode`.
                  description: 1 to 16 file parts. Part names are not enforced; anything that is not `meta` is read as a file.
      parameters:
      - schema:
          default: true
          type: boolean
        in: query
        name: enrich
        required: false
        description: 'Default true: full enrichment included in the per-applicant price. Pass false to skip.'
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - applicant_id
                - submitted_at
                - expires_at
                - status_url
                properties:
                  id:
                    format: uuid
                    type: string
                  status:
                    type: string
                    enum:
                    - pending
                  applicant_id:
                    type: string
                  submitted_at:
                    format: date-time
                    type: string
                  expires_at:
                    format: date-time
                    type: string
                  status_url:
                    type: string
