  /v1/underwrite/collection-links:
    post:
      operationId: createCollectionLink
      summary: Mint a borrower statement-collection link
      tags:
      - underwriting
      description: 'Creates a single-use, expiring, lender-scoped link and returns its borrower URL once. Send the URL to the borrower; they open a Distyra-hosted page, consent, and upload bank statements that auto-analyze under your organization. You are notified on completion via the `analysis.completed` webhook and can re-fetch the result with GET /v1/underwrite/analyses/:id.


        **Required scope:** `underwriting:write`.'
