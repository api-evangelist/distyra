aid: distyra

name: Brightfield Software

image: https://www.distyra.eu/assets/og/distyra-og.png

description: Brightfield Software, operating under the Distyra brand, provides European bank data APIs that deliver raw transaction information
  distilled into actionable signals. Their platform offers products for data enrichment, underwriting, and compliance, tailored to European payment
  formats and regulations. Built in the EU, Distyra ensures data residency and privacy, supporting developers with comprehensive documentation,
  pricing plans, and a status page. The service aims to simplify access to bank data for fintech applications, offering a free tier and enterprise
  options.

