  /v1/underwrite/analyze/statement/parsed/async:
    post:
      operationId: analyzeApplicantFromParsedStatementAsync
      summary: Submit a browser-parsed PDF statement for background analysis
      tags:
      - underwriting
      description: 'Asynchronous, submit-then-poll variant of `POST /v1/underwrite/analyze/statement/parsed`. Returns `202` with a job id; poll `GET /v1/underwrite/analyze/statement/async/{id}` until `status` is `completed` (or `failed`), then read `result` (the same payload the synchronous endpoint returns). Use this from a browser/edge client so enrichment of a large statement can''t hit the request ceiling.


        Billing/idempotency/webhooks are identical to the synchronous `/parsed` endpoint (the worker re-invokes it internally). A submission whose balances don''t reconcile fails the job with `pdf_extraction_unreliable`.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: Pre-parsed PDF statement (Phase 2 browser path). The deterministic parser ran in the lender's browser; only the structured accounts reach saas-api. The server re-runs the reconciliation gate, then enriches + analyzes + builds the evidence package identically to the file-upload path.
              type: object
              required:
              - applicant_id
              - accounts
              properties:
                applicant_id:
                  minLength: 1
                  maxLength: 256
                  type: string
                  example: loan_app_42
                applicant_type:
                  default: business
                  description: Which regulatory regime this analysis runs under. Defaults to 'business'. A sole trader is a natural person and must be sent as 'consumer'. Requires a separate contractual entitlement; 403 otherwise.
                  anyOf:
                  - type: string
                    enum:
                    - business
                  - type: string
                    enum:
                    - consumer
                analysis_window:
                  type: object
                  required:
                  - start
                  - end
                  properties:
                    start:
                      format: date
                      type: string
                    end:
                      format: date
                      type: string
                declared_monthly_income:
                  minimum: 0
                  description: 'The monthly income the applicant declared to you, in decimal currency units. **Consumer only.** Sending it with `applicant_type: business` returns 400 rather than being ignored, because a supplied figure that silently does nothing is worse than a refusal. Supplying it engages `features.income_corroboration`, which compares your figure against what the statements show and returns a signed `variance_pct` plus an outcome of `corroborated` (within 10%), `partial` (within 25%), `not_corroborated`, or `insufficient_window` (fewer than 3 whole months). The bands are symmetric on purpose: this reports whether the two figures agree, not whether to lend, and an asymmetric band would be us making your credit judgment. The figure is used for nothing else. It does not enter `features.income` and cannot move any other feature.'
                  type: number
                household:
                  description: '**Consumer only.** Sending it with `applicant_type: business` returns 400. Household composition and tenure as you supplied them. Echoed verbatim at `features.affordability.household` and read by nothing: no figure we return depends on it. It is carried so you can apply your own affordability norm against our residual-income and ratio figures in one payload. **Never inferred**: deriving household size from transaction patterns would be unreliable and Article 9 adjacent, since the signals it would key on are childcare, school fees and medical costs. Omit it and `features.affordability.household` is null.'
                  type: object
                  required:
                  - adults
                  - dependants
                  - tenure
                  properties:
                    adults:
                      minimum: 1
                      maximum: 20
                      type: integer
                      example: 2
                    dependants:
                      minimum: 0
                      maximum: 20
                      type: integer
                      example: 1
                    tenure:
                      anyOf:
                      - type: string
                        enum:
                        - rent
                      - type: string
                        enum:
                        - own
                      example: rent
                allow_partial:
                  default: false
                  type: boolean
                source:
                  additionalProperties: true
                  description: Optional client telemetry about the parse (e.g. original PDF byte size).
                  type: object
                  properties:
                    bytes_in:
                      type: number
                accounts:
                  minItems: 1
                  maxItems: 16
                  type: array
                  items:
                    additionalProperties: true
                    description: 'A browser-parsed account: { account_id, iban?, currency, opening_balance_micros, closing_balance_micros, committed_limit_micros?, available_balance_micros?, statement_period:{start,end}, transactions:[{id,date,amount_micros,currency,descriptor_raw,counterparty_iban?}] }. Amount/balance fields are decimal-integer micro strings.'
                    type: object
                    properties: {}
