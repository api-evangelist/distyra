                          anyOf:
                          - type: string
                          - type: 'null'
                        bank_code_description:
                          description: The bank's own label for what kind of transaction this is. Available on some banks only.
                          anyOf:
                          - type: string
                          - type: 'null'
                        bank_code_codes:
                          description: The bank's transaction type codes as sent (ISO 20022 or proprietary). Empty when the bank sends none.
                          type: array
                          items:
                            type: string
                        bank_code_iso_pair:
