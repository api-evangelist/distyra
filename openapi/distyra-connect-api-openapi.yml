                          - type: 'null'
                        structured_reference:
                          description: A structured payment reference whose check digits are valid, for matching a payment to an invoice. Taken from `reference_number` when the bank labels one, otherwise found in `remittance_information`. Null when there is none, when its check digits fail, or when the communication carries two different references.
                          anyOf:
                          - type: object
                            required:
                            - scheme
                            - reference
                            - formatted
                            - source
                            properties:
                              scheme:
                                description: '`BE`: Belgian structured communication (OGM/VCS). `RF`: ISO 11649 creditor reference.'
                                anyOf:
                                - type: string
