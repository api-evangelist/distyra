                          anyOf:
                          - type: string
                          - type: 'null'
                        counterparty_iban:
                          description: 'The other party''s IBAN: the payer on money in, the payee on money out. Null when the bank does not send it; some banks send a domestic account number instead (see `counterparty_bban`).'
