  /v1/underwrite/ingest/batch:
    post:
      operationId: ingestStatementBatch
      summary: Multi-file statement upload (multipart-with-N-files or ZIP)
      tags:
      - underwriting
      description: 'Explicit multi-file ingest. Accepts either a single ZIP file part (server-side unpack) or multiple file parts in one multipart body (each part is one statement file). Always returns the bundle envelope: `{ bundle_id, source, file_count, processed_count, ingestions[], skipped[], available_until }`.


        **When to use this vs `POST /v1/underwrite/ingest`:** use `/ingest/batch` when you always want the bundle envelope, regardless of file count (cleaner client code than discriminating on `bundle_id` presence). Use `/ingest` when you want the polymorphic shape (single file → single response, ZIP → bundle).


        **Limits.** 25MB per file. 100MB total compressed (multi-file path) or ~500MB uncompressed total (ZIP path). 500 files / entries.


        **Billing.** One ledger entry per file. Per-format rates from the subscription (same as `/ingest`). If a charge fails mid-batch, the response returns 402 with `incomplete: true` and the partial bundle. Customer pays only for what landed.


        **Enrichment (`?enrich=true`).** Same semantics as `POST /v1/underwrite/ingest`: enriches the transactions in each file, billed per transaction as a separate ledger entry, reported per file in `ingestions[].enrichment_billed_micros`.


        **Strategy gate.** Same sales-led gate as `POST /v1/underwrite/ingest`. Returns 402 `sales_led_only` unless `organizations.statement_ingest_contract` is true. `POST /v1/underwrite/analyze/statement` is unaffected.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - files
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                    description: One statement file.
                  description: Two or more statement files. Part names are not enforced; every file part is read.
      parameters:
      - schema:
          anyOf:
          - type: string
            enum:
            - camt053
          - type: string
            enum:
            - mt940
          - type: string
            enum:
            - cfonb120
          - type: string
            enum:
            - coda
          - type: string
            enum:
            - norma43
          - type: string
            enum:
            - cbi
          - type: string
            enum:
            - bgmax
          - type: string
            enum:
            - pdf
          - type: string
            enum:
            - auto
        in: query
        name: format
        required: false
        description: 'Statement format. `auto` (default) sniffs the magic bytes: `<?xml` → camt053 (or cbi if a `<CBIBdy*>` envelope is present), `:20:` or `{1:` → mt940, opening `01` record code → cfonb120, opening `00000` header → coda (Belgian Febelfin), opening `11` record code → norma43 (Spanish AEB Cuaderno 43), opening `01BGMAX` header → bgmax (Swedish Bankgirot receivables; SEK + EUR), `%PDF` → pdf. `cbi` currently supports the XML envelope variant only; the legacy 120-char tracciato is rejected with a deferred-spec error. `bgmax` is receivables-only (no opening balance, no debits); cash-position features degrade gracefully for BGMAX-only uploads.'
      - schema:
          type: boolean
        in: query
        name: retain_for_debug
        required: false
      - schema:
          type: boolean
        in: query
        name: allow_partial
        required: false
      - schema:
          default: false
          type: boolean
        in: query
        name: enrich
        required: false
        description: When true, runs paid enrichment on every parsed transaction in every file (matches `/v1/enrich` quality). Additional per-transaction enrichment fee applies, reported per file in `ingestions[].enrichment_billed_micros`. Default false.
      - schema:
          default: business
          anyOf:
          - type: string
            enum:
            - business
          - type: string
            enum:
            - consumer
        in: query
        name: applicant_type
        required: false
        description: 'Only meaningful with `?enrich=true`. Set `consumer` when the statement belongs to a natural person: enrichment then runs the GDPR Article 9 / CCD2 Article 18(3) suppression layer, so merchant resolutions that would be an inference about health, religion or belief, political opinion, trade-union membership or ethnic origin are collapsed before they reach the response or the 7-day re-fetch. Requires the consumer underwriting contract (403 `consumer_underwriting_not_entitled` without it). Defaults to `business`.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - bundle_id
                - source
                - file_count
                - processed_count
                - incomplete
                - incomplete_reason
                - ingestions
                - skipped
                - available_until
                properties:
                  bundle_id:
                    format: uuid
                    type: string
                  source:
                    anyOf:
                    - type: string
                      enum:
                      - zip
                    - type: string
                      enum:
                      - multipart
                  file_count:
                    description: Total usable files in the bundle (excluding ZIP entries skipped via the allowlist).
                    type: integer
                  processed_count:
                    description: How many files were fully ingested. Equals file_count on success; lower when the batch stopped early (typically insufficient credit mid-batch; see `incomplete_reason`).
                    type: integer
                  incomplete:
                    description: true when processed_count < file_count. Customer paid only for what landed; remaining files can be retried after the underlying issue is resolved.
                    type: boolean
                  incomplete_reason:
                    anyOf:
                    - type: string
                    - type: 'null'
                  ingestions:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - filename
                      - format
                      - bytes_in
                      - txn_count_parsed
                      - txn_count_dropped
                      - mistral_tokens_used
                      - accounts
                      - errors
                      - raw_file_retained
                      - billed_amount_micros
                      - enriched
                      - enrichment_billed_micros
                      properties:
                        id:
                          format: uuid
                          type: string
                        filename:
                          description: Filename as it appeared in the ZIP archive or multipart part. Null when no filename was provided.
                          anyOf:
                          - type: string
                          - type: 'null'
                        format:
                          description: 'Statement format. `auto` (default) sniffs the magic bytes: `<?xml` → camt053 (or cbi if a `<CBIBdy*>` envelope is present), `:20:` or `{1:` → mt940, opening `01` record code → cfonb120, opening `00000` header → coda (Belgian Febelfin), opening `11` record code → norma43 (Spanish AEB Cuaderno 43), opening `01BGMAX` header → bgmax (Swedish Bankgirot receivables; SEK + EUR), `%PDF` → pdf. `cbi` currently supports the XML envelope variant only; the legacy 120-char tracciato is rejected with a deferred-spec error. `bgmax` is receivables-only (no opening balance, no debits); cash-position features degrade gracefully for BGMAX-only uploads.'
                          anyOf:
                          - type: string
                            enum:
                            - camt053
                          - type: string
                            enum:
                            - mt940
                          - type: string
                            enum:
                            - cfonb120
                          - type: string
                            enum:
                            - coda
                          - type: string
                            enum:
                            - norma43
                          - type: string
                            enum:
                            - cbi
                          - type: string
                            enum:
                            - bgmax
                          - type: string
                            enum:
                            - pdf
                          - type: string
                            enum:
                            - auto
                        bytes_in:
                          type: integer
                        txn_count_parsed:
                          type: integer
                        txn_count_dropped:
                          type: integer
                        mistral_tokens_used:
                          anyOf:
                          - type: integer
                          - type: 'null'
                        accounts:
                          type: array
                          items:
                            additionalProperties: false
                            type: object
                            required:
                            - account_id
                            - iban
                            - currency
                            - opening_balance_micros
                            - closing_balance_micros
                            - committed_limit_micros
                            - available_balance_micros
                            - statement_period
                            - transactions
                            properties:
                              account_id:
                                type: string
                              iban:
                                anyOf:
                                - type: string
                                - type: 'null'
                              currency:
                                type: string
                              opening_balance_micros:
                                description: bigint serialized as string
                                type: string
                              closing_balance_micros:
                                description: bigint serialized as string
                                type: string
                              committed_limit_micros:
                                anyOf:
                                - type: string
                                - type: 'null'
                              available_balance_micros:
                                anyOf:
                                - type: string
                                - type: 'null'
                              statement_period:
                                type: object
                                required:
                                - start
                                - end
                                properties:
                                  start:
                                    type: string
                                  end:
                                    type: string
                              transactions:
                                type: array
                                items: {}
                        errors:
                          type: array
                          items:
                            type: object
                            required:
                            - code
                            - message
                            - location
                            properties:
                              code:
                                type: string
                              message:
                                type: string
                              location:
                                type: string
                        raw_file_retained:
                          type: boolean
                        billed_amount_micros:
                          description: bigint serialized as string. The per-file ingest charge only. The enrichment debit (when `?enrich=true`) is reported separately in `enrichment_billed_micros`.
                          type: string
                        enriched:
                          type: boolean
                        enrichment_billed_micros:
                          description: bigint serialized as string
                          type: string
                  skipped:
                    description: ZIP entries excluded by the statement-format allowlist (directories, dotfiles, .csv, etc.). Empty array on multipart uploads.
                    type: array
                    items:
                      type: object
                      required:
                      - entry_name
                      - reason
                      properties:
                        entry_name:
                          type: string
                        reason:
                          description: directory | hidden | unsupported_extension | empty
                          type: string
                  available_until:
                    format: date-time
                    type: string
