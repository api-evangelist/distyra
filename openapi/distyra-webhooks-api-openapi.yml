    get:
      operationId: listWebhookEndpoints
      summary: List webhook endpoints for the caller org
      tags:
      - Webhooks
      description: 'Every webhook endpoint registered by your organization, with its subscribed events and status. Signing secrets are never returned after creation. Rotate to get a new one. Only endpoints of the calling key''s mode are listed: a test key sees test endpoints.


        **Required scope:** `webhooks:read`.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - endpoints
                properties:
                  endpoints:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - livemode
                      - url
                      - secret_prefix
                      - events
                      - status
                      - consecutive_failures
                      - created_at
                      - rotated_at
                      - last_delivered_at
                      properties:
                        id:
                          format: uuid
                          type: string
                        livemode:
                          description: false for an endpoint created with a test key. It receives events about test-mode activity only, and a live endpoint only live ones. Each mode has its own endpoints; neither key can see the other's.
                          type: boolean
                        url:
                          format: uri
                          type: string
                        secret_prefix:
                          type: string
                        events:
                          type: array
                          items:
                            type: string
                        status:
                          anyOf:
                          - type: string
                            enum:
                            - active
                          - type: string
                            enum:
                            - disabled
                          - type: string
                            enum:
                            - auto_disabled
                        consecutive_failures:
                          type: integer
                        created_at:
                          format: date-time
                          type: string
                        rotated_at:
                          anyOf:
                          - format: date-time
                            type: string
                          - type: 'null'
                        last_delivered_at:
                          anyOf:
                          - format: date-time
                            type: string
                          - type: 'null'
