                                anyOf:
                                - type: string
                                - type: 'null'
                              source:
                                description: 'Where the category labels came from. ''catalog'': the curated catalog row''s industry/subindustry (deterministic: the same merchant always returns the same category). ''llm'': labels proposed by an AI model for a merchant not yet in our catalogue, drawn from the same vocabulary but not yet reviewed by us. null: no category available.'
