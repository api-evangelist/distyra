  /v1/connect/connections/{id}/accounts:
    get:
      operationId: getConnectionAccounts
      summary: List the accounts on a connection
      tags:
      - Connect
      description: 'The accounts the account holder authorized on this connection. Served from our own metadata, so it answers even when the bank is unreachable; live balances are best-effort and each account reports `balance_known` accordingly. With `allow_stored=true`, a call in the five minutes after a fetch for the connection failed at the bank returns the accounts without live balances and does not use a fetch from the daily allowance. The IBAN is returned masked (`iban_masked`). The full value is seen once, during the authorization exchange, and is not stored.


        `account_id` identifies an account **on this connection only**. The bank issues a new one at every authorization, so an account the same holder re-authorizes comes back under a different `account_id`. To match it against one you already hold, compare `(iban_masked, currency)` within the connection, and treat that as a heuristic: `iban_masked` is four characters, and this API publishes no stable account key.


        This call reaches the bank, so it draws on the same daily allowance as GET /v1/connect/connections/{id}/transactions and answers the same 429 when it is spent. One live balance call is made per account. The allowance belongs to the connection, not to a route, so four fetches here and four there is still four in total. As on the transactions endpoint, sending `Psu-Ip-Address` and `Psu-User-Agent` for an end user who is actually on screen exempts the call.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          enum:
          - 'true'
          - 'false'
          type: string
        example: 'true'
        in: query
        name: allow_stored
        required: false
        description: 'When `true`, and a fetch for this connection failed at the bank in the last five minutes, answer from the account details we hold, without live balances and without using a fetch from the daily allowance. Each account then reads `balance_known: false`. Has no effect on a fetch made while your user is on screen. When omitted or `false`, the call reaches the bank as it always has.'
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      - schema:
          type: string
        in: header
        name: psu-ip-address
        required: false
        description: Your end user's IP, when one is waiting on this call. Send with `Psu-User-Agent`; both or neither.
      - schema:
          maxLength: 512
          type: string
        in: header
        name: psu-user-agent
        required: false
        description: Your end user's browser User-Agent. Send with `Psu-Ip-Address`; both or neither.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                      - account_id
                      - name
                      - holder_name
                      - currency
                      - iban_masked
                      - cash_account_type
                      - balance_booked
                      - balance_available
                      - balance_known
                      properties:
                        account_id:
                          description: 'The bank''s identifier for this account **on this connection only**, and what `/transactions` tags each entry with. **Not stable across re-authorization:** the bank issues a new one every time the account holder authorizes, so the same account comes back under a different `account_id` on the next connection. To recognise an account across connections, match on `(iban_masked, currency)` within the connection, which names its own bank. The currency half is load-bearing, not decoration: some banks return several currency accounts behind a **single** shared IBAN, so matching on the IBAN alone collapses them into a single account. `iban_masked` is the last four characters, so this is a heuristic and not an identity: we publish no stable account key today, and null `iban_masked` leaves nothing to match on.'
                          type: string
                        uid:
                          description: The same value as `account_id`, byte for byte. Kept for callers written against the earlier field name; prefer `account_id`.
                          type: string
                        name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        holder_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        currency:
                          anyOf:
                          - type: string
                          - type: 'null'
                        iban_masked:
                          description: Last four characters of the IBAN, masked for display (e.g. `•••• 1234`). The full IBAN is returned only once, in the authorization exchange, and is not stored. Null when the bank supplied no IBAN for that account, in which case re-authorizing changes nothing. It can also be null on a connection authorized before 2026-08-28, or before 2026-10-12 at a bank that sends the IBAN only among its other account identifiers; re-authorizing fills those in. Do not treat null as a prompt to re-authorize on its own.
                          anyOf:
                          - type: string
                          - type: 'null'
                        account_type:
                          description: 'Who holds the account, as the bank reports it: `business` or `personal`. Omitted when the bank does not say. This is the holder type, not the kind of account; see `cash_account_type` for current, savings or card.'
                          type: string
                        cash_account_type:
                          description: 'The kind of account, as the ISO 20022 code the bank reports: `CACC` current account, `SVGS` savings, `CARD` card account, `LOAN` loan, `CASH` cash account, `OTHR` anything else. Captured when the account holder authorizes the connection, because banks provide it only then. Null for connections authorized before this field was added in September 2026 (re-authorizing fills it in) and when the bank sends no recognised code.'
                          anyOf:
                          - type: string
                            enum:
                            - CACC
                          - type: string
                            enum:
                            - CARD
                          - type: string
                            enum:
                            - CASH
                          - type: string
                            enum:
                            - LOAN
                          - type: string
                            enum:
                            - OTHR
                          - type: string
                            enum:
                            - SVGS
                          - type: 'null'
                        balance:
                          description: 'One balance per account, chosen for you: the available balance when the bank sends one, otherwise the closing booked balance, otherwise the first balance the bank lists. Kept as it has always been. To read the booked and the available balance separately, use `balance_booked` and `balance_available`.'
                          type: object
                          required:
                          - amount
                          - currency
                          properties:
                            amount:
                              type: number
                            currency:
                              type: string
                        balance_booked:
                          description: 'The booked balance: what the bank has booked to the account, without pending entries. Taken from the interim booked balance (`ITBD`, calculated during the day) when the bank sends one, otherwise the closing booked balance (`CLBD`, at the end of the bank''s last reporting period); `balance_type` says which. Null when the bank sends neither, or when balances could not be read. Comes from the same bank call as `balance`, so it costs nothing extra.'
                          anyOf:
                          - type: object
                            required:
                            - amount
                            - currency
                            - balance_type
                            properties:
                              amount:
                                type: number
                              currency:
                                description: The currency the bank gave for this balance. Null if it gave none.
                                anyOf:
                                - type: string
                                - type: 'null'
                              balance_type:
                                description: The ISO 20022 balance type this figure was taken from.
                                anyOf:
                                - type: string
                                  enum:
                                  - ITBD
                                - type: string
                                  enum:
                                  - CLBD
                          - type: 'null'
                        balance_available:
                          description: 'The available balance: what the bank reports as available to spend. Taken from the interim available balance (`ITAV`, calculated during the day) when the bank sends one, otherwise the closing available balance (`CLAV`); `balance_type` says which. Null when the bank sends neither, or when balances could not be read. Comes from the same bank call as `balance`, so it costs nothing extra.'
                          anyOf:
                          - type: object
                            required:
                            - amount
                            - currency
                            - balance_type
                            properties:
                              amount:
                                type: number
                              currency:
                                description: The currency the bank gave for this balance. Null if it gave none.
                                anyOf:
                                - type: string
                                - type: 'null'
                              balance_type:
                                description: The ISO 20022 balance type this figure was taken from.
                                anyOf:
                                - type: string
                                  enum:
                                  - ITAV
                                - type: string
                                  enum:
                                  - CLAV
                          - type: 'null'
                        balance_known:
                          type: boolean
        '401':
          description: Standard error envelope used for all non-2xx responses.
          content:
            application/json:
              schema:
                description: Standard error envelope used for all non-2xx responses.
                type: object
                required:
                - error
                properties:
                  error:
                    description: Stable machine-readable code. SDK consumers should switch on this.
                    type: string
