openapi: 3.2.0
info:
  title: Distyra Transaction Enrichment Connect API
  description: EU-native PSD2-specialist transaction enrichment.
  version: 1.11.0
servers:
- url: https://api.distyra.com
  description: Production (EU). Base URL stays api.distyra.com even though the website and portal use .eu.
tags:
- name: Connect
  description: Live PSD2/AIS bank connections (Distyra Connect).
paths:
  /v1/connect/coverage:
    get:
      operationId: connectCoverage
      summary: List the banks (ASPSPs) Connect covers across Europe
      tags:
      - Connect
      description: 'The banks Distyra Connect can connect to for business accounts, and how many there are per country. This is the list the coverage page on distyra.eu is built from.


        **Public:** no API key is needed. The list is always the live one, whichever key mode you use elsewhere.


        **Freshness:** the list is cached for up to 24 hours and refreshed in the background once it is older than that, so `updated_at` says how old the answer is. The response carries `Cache-Control: public, max-age=86400`.


        **Errors:** 503 `connect_unconfigured` while Connect is not configured; 502 `upstream_error` when the list cannot be fetched from Enable Banking and nothing is cached yet.'
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                required:
                - updated_at
                - total_banks
                - country_count
                - countries
                - banks
                properties:
                  updated_at:
                    format: date-time
                    description: When this list was fetched from Enable Banking.
                    type: string
                  total_banks:
                    description: Number of banks in `banks`.
                    type: integer
                  country_count:
                    description: Number of countries in `countries`.
                    type: integer
                  countries:
                    type: array
                    items:
                      type: object
                      required:
                      - country
                      - bank_count
                      properties:
                        country:
                          description: ISO 3166-1 alpha-2 country code.
                          type: string
                        bank_count:
                          description: Banks covered in this country.
                          type: integer
                  banks:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - country
                      properties:
                        name:
                          description: The bank name as Enable Banking lists it.
                          type: string
                        country:
                          description: ISO 3166-1 alpha-2 country code.
                          type: string
        '429':
          description: Standard error envelope used for all non-2xx responses.
          content:
            application/json:
              schema:
                description: Standard error envelope used for all non-2xx responses.
                type: object
                required:
                - error
                properties:
                  error:
                    description: Stable machine-readable code. SDK consumers should switch on this.
                    type: string
                    example: invalid_key
                  detail:
                    description: Free-form human-readable explanation. Safe to surface.
                    type: string
                  request_id:
                    description: Server-generated request id (also returned as the X-Request-Id header). Quote it when contacting support to correlate a failed call with server logs. Present on errors surfaced by the global error handler.
                    type: string
                  scope:
                    description: '429 only. Which window tripped: `burst` (per-second) or `sustained` (per-minute average).'
                    anyOf:
                    - type: string
                      enum:
                      - burst
                    - type: string
                      enum:
                      - sustained
                  retry_after_seconds:
                    description: On a 429, and on a 503 `bank_unavailable` from Connect. Seconds to wait before retrying. Mirrors the `Retry-After` header for clients that would rather not parse headers.
                    type: integer
                  max:
                    description: 429 only. The limit that was exceeded, in the units of `scope` (requests/second for `burst`, requests/minute for `sustained`).
                    type: integer
              examples:
                example1:
                  value:
                    error: invalid_key
                    detail: API key not recognized or revoked.
                example2:
                  value:
                    error: rate_limited
                    detail: Burst rate limit exceeded (20 requests/sec). Retry after 1s.
                    scope: burst
                    retry_after_seconds: 1
                    max: 20
