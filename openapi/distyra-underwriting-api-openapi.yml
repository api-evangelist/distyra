  /v1/underwrite/collection-links/{id}/finish-analyze:
    post:
      operationId: finishCollectionAnalyze
      summary: Run one consolidated analysis over the staged files and complete the link
      tags:
      - underwriting
      description: 'Loads every staged file, submits one background analysis over the whole bundle (same-IBAN fragments consolidate across files; the merged window feeds the engines; gaps surface as `balance_chain_break` evidence warnings), deletes the staged copies, and flips the link to completed. `applicant_id` is the link''s application_ref. Returns 202 + the analysis job id; subscribe to `analysis.completed` or poll the async status endpoint.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                enrich:
                  default: true
                  type: boolean
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - status
                - applicant_id
                - file_count
                - status_url
                properties:
                  id:
                    format: uuid
                    type: string
                  status:
                    type: string
                    enum:
