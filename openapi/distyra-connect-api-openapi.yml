                            type: string
                          - type: 'null'
                        value_date:
                          description: YYYY-MM-DD. The date the money became available (credit) or stopped being available (debit), when the bank sends one.
                          anyOf:
                          - format: date
                            type: string
                          - type: 'null'
                        transaction_date:
                          description: YYYY-MM-DD. The card transaction date, or the date the bank received a transfer or direct debit, when the bank sends one. Some banks send only this date.
                          anyOf:
                          - format: date
                            type: string
                          - type: 'null'
                        amount:
                          description: 'The decimal amount Enable Banking reports, in the currency''s major unit and never rescaled: EUR 22.40 is `22.4`, never `2240`. How many decimal places a bank sends varies by currency. Signed from `credit_debit`: negative is money out (`DBIT`), positive is money in (`CRDT`). Enable Banking requires the indicator on every entry; if one were ever missing, `credit_debit` is null and this is the unsigned amount, so treat its direction as unknown. Null when the bank sends no amount, or one that does not start with a number.'
                          anyOf:
                          - type: number
                          - type: 'null'
                        currency:
                          description: ISO 4217 code. Null only when the bank sends none.
                          anyOf:
                          - type: string
                          - type: 'null'
                        descriptor:
                          description: 'Raw text we enrich from: the counterparty name, else the remittance text. Because the name wins, the payment communication is usually not here; read `remittance_information` and `structured_reference` for that.'
