  /v1/underwrite/collection-links/{id}/files:
    post:
      operationId: stageCollectionFile
      summary: Stage a statement file on a collection link
      tags:
      - underwriting
      description: 'Uploads one statement file to the link''s staging area (encrypted at rest, EU). Files accumulate until `finish-analyze` runs one consolidated analysis over the whole bundle and deletes the staged copies. Abandoned staged files are automatically purged by a 7-day storage lifecycle. Multipart: a single file part. Requires the link to be active (consented) and unexpired.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                  description: 'One statement file to add to this link staging area. The part name is not enforced: the first file part wins. Call once per file; finish-analyze then runs a single consolidated analysis over the whole bundle.'
