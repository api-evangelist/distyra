  /v1/connect/connections/{id}/identity:
    get:
      operationId: getConnectionIdentity
      summary: Account-holder identity for a connection (ownership verification)
      tags:
      - Connect
      description: 'Returns the account holder name the bank reports for each account. Pass applicant_name to get a token-match verdict (match / partial / no_match) per account, to confirm an account belongs to your applicant. Holder names are provided by the bank and vary in format; use the verdict as a confirmation signal.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          maxLength: 200
          type: string
        in: query
        name: applicant_name
        required: false
        description: Name to match holders against.
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - accounts
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      required:
                      - account_id
                      - holder_name
                      - iban_masked
                      - cash_account_type
                      - currency
                      properties:
                        account_id:
                          type: string
                        holder_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        iban_masked:
                          description: Last four characters of the IBAN, masked for display (e.g. `•••• 1234`). The full IBAN is returned only once, in the authorization exchange, and is not stored. Null when the bank supplied no IBAN for that account, in which case re-authorizing changes nothing. It can also be null on a connection authorized before 2026-08-28, or before 2026-10-12 at a bank that sends the IBAN only among its other account identifiers; re-authorizing fills those in. Do not treat null as a prompt to re-authorize on its own.
                          anyOf:
                          - type: string
                          - type: 'null'
                        account_type:
                          description: 'Who holds the account, as the bank reports it: `business` or `personal`. Omitted when the bank does not say. This is the holder type, not the kind of account; see `cash_account_type` for current, savings or card.'
                          type: string
                        cash_account_type:
                          description: 'The kind of account, as the ISO 20022 code the bank reports: `CACC` current account, `SVGS` savings, `CARD` card account, `LOAN` loan, `CASH` cash account, `OTHR` anything else. Captured when the account holder authorizes the connection, because banks provide it only then. Null for connections authorized before this field was added in September 2026 (re-authorizing fills it in) and when the bank sends no recognised code.'
                          anyOf:
                          - type: string
                            enum:
                            - CACC
                          - type: string
                            enum:
                            - CARD
                          - type: string
                            enum:
                            - CASH
                          - type: string
                            enum:
                            - LOAN
                          - type: string
                            enum:
                            - OTHR
                          - type: string
                            enum:
                            - SVGS
                          - type: 'null'
                        currency:
                          anyOf:
                          - type: string
                          - type: 'null'
                        name_match:
                          type: object
                          required:
                          - verdict
                          - score
                          properties:
                            verdict:
                              anyOf:
                              - type: string
                                enum:
                                - match
                              - type: string
                                enum:
                                - partial
                              - type: string
                                enum:
                                - no_match
                            score:
                              type: number
