  /v1/categories:
    get:
      operationId: getCategories
      summary: Return the canonical industry/subindustry vocabulary
      tags:
      - Catalog
      description: 'The full universe of `merchant.industry` and `category.secondary` strings enrichment may return. Sourced from the canonical taxonomy file; safe to cache on the client for the day.


        **Required scope:** `enrichment:read`.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - industries
                properties:
                  industries:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - subindustries
                      properties:
                        name:
                          type: string
                        subindustries:
                          type: array
                          items:
                            type: string
