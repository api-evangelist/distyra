  /v1/webhook_deliveries:
    get:
      operationId: listWebhookDeliveries
      summary: List webhook delivery attempts for the caller org
      tags:
      - Webhooks
      description: 'Per-attempt delivery log, most-recent-first, scoped to the caller org. Filter by endpoint_id and/or status; page backwards with the `before` cursor. Payload bytes are not included. Response_excerpt, error_excerpt and http_status are provided for debugging. Only deliveries to endpoints of the calling key''s mode are listed.


        **Required scope:** `webhooks:read`.'
      parameters:
      - schema:
          format: uuid
          type: string
        in: query
        name: endpoint_id
        required: false
        description: Only deliveries for this endpoint.
      - schema:
          anyOf:
          - type: string
            enum:
            - pending
          - type: string
            enum:
            - delivered
          - type: string
            enum:
            - failed
          - type: string
            enum:
            - exhausted
        in: query
        name: status
        required: false
      - schema:
