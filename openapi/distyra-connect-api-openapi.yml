                          description: 'Exactly `status === "PDNG"`, so the two never disagree. We do not ask the bank for pending entries, so this reflects only what a bank volunteers and is false on most connections. `false` means "not marked pending", not "booked": a cancelled, rejected, held or scheduled entry is also `false`. Use `status` to decide whether an entry is booked.'
