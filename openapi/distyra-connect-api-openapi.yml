  /v1/connect/aspsps:
    get:
      operationId: listAspsps
      summary: List banks (ASPSPs) available for a country
      tags:
      - Connect
      description: 'The banks we can open a connection to in a given country, for the given PSU type. Pass a name from this list verbatim as `aspsp_name` on POST /v1/connect/connections: a loose match is refused rather than guessed at.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          minLength: 2
          maxLength: 2
          type: string
        in: query
        name: country
        required: true
      - schema:
          anyOf:
          - type: string
            enum:
            - business
          - type: string
            enum:
            - personal
        in: query
        name: psu_type
        required: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - country
                - psu_type
                - aspsps
                properties:
                  country:
                    type: string
                  psu_type:
                    anyOf:
                    - type: string
                      enum:
                      - business
                    - type: string
                      enum:
                      - personal
                  aspsps:
                    type: array
                    items:
                      type: object
                      required:
                      - name
                      - country
                      - max_consent_days
                      - psu_types
                      properties:
                        name:
                          type: string
                        country:
                          type: string
                        max_consent_days:
                          description: How long this bank will keep a consent valid, in days. Connect requests exactly this for your own and end-user connections, so it is how long before the account holder must re-authorise. Null when the bank publishes no maximum, in which case 90 days is requested. Measured across the EEA on 2026-09-04, almost every bank permits 180.
                          anyOf:
                          - type: integer
                          - type: 'null'
                        psu_types:
                          description: Which account holder types this bank supports (`business`, `personal`, or both).
                          type: array
                          items:
                            type: string
                        data_caveats:
                          description: 'Present only when we know something specific about what this bank does not send, so you can set expectations before an account holder picks it. Absent is not a grade: it covers both banks that send everything and banks we hold no evidence about, and the two should not be presented the same way. Nothing here ranks banks against each other. These describe what a connector has sent in the past, sometimes only a few dozen transactions, rather than the account being connected, so treat them as context worth surfacing rather than a reason to steer somebody away from their own bank.'
                          type: object
                          properties:
                            no_transaction_type:
                              description: 'This bank has not sent a transaction code or a description in the traffic we have seen from it, so expect `transaction_type` to be null. Nothing to retry: it changes if the bank starts sending it.'
                              type: boolean
                              enum:
                              - true
                            sparse_counterparty_name:
                              description: This bank has typically left the counterparty name off a meaningful share of entries. Those fall back to whatever reference text the bank sends, which is weaker to identify a merchant from than a payee name, so expect more of them to come back unresolved.
                              type: boolean
                              enum:
                              - true
                            no_counterparty_text:
                              description: 'Stronger than `sparse_counterparty_name` and never sent alongside it. This bank has sent neither a counterparty name nor remittance text on a meaningful share of entries, so expect some rows to carry no text at all: a date, an amount and nothing to identify. Those cannot be enriched by anyone.'
                              type: boolean
                              enum:
                              - true
                            beta:
                              description: 'Enable Banking marks this connector **beta**. It is the provider''s own maturity marker, passed through unchanged, and it is a disclosure rather than a prediction: beta connectors do work and some non-beta ones fail. What it tells you is that this connector has had less exposure than a generally available one, so when choosing between two banks for a first integration, prefer the one without this flag. Absent means not marked beta. Measured on the live registry 2026-10-01: 96% of Italian connectors carry it, 70% of French and 53% of Spanish, so in some countries almost every choice carries it.'
                              type: boolean
                              enum:
                              - true
                            observed_through:
                              format: date
                              description: 'The newest traffic behind the three sparseness flags above, as a date. Present whenever any of them is, absent otherwise, and it does **not** describe `beta`, which comes from the live connector record rather than from observed traffic. Read it as a weight on the claim rather than as decoration: these flags come from a periodic sample of what connectors have sent, so a flag dated some months back may describe a bank that has since started sending the field. The strongest flag is the one most exposed to this, because `no_transaction_type` rests on having seen no code at all, and never having observed one is not the same as the bank not sending one. If a date here is old and the distinction matters to you, ask us to re-check that bank rather than designing around it.'
                              type: string
