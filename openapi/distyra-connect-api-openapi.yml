    get:
      operationId: listConnections
      summary: List your bank connections
      tags:
      - Connect
      description: 'Your organization''s connections, newest first. Metadata only: no transaction data is stored behind a connection, so nothing here carries amounts or dates.


        Test and live are separate: a test key lists the sandbox connections created with test keys, and a live key lists live connections. The same holds for every route that reads or ends a connection by id, where a connection of the other mode answers 404 with a detail naming the key that reads it.


        Page with `cursor`: pass the `next_cursor` from the previous response until it comes back null. The cursor is a position in the result, not an offset, so connections created while you page do not shift rows onto a page you have already read.


        Filter by `external_ref` to find the connections for one of your own users. Note that external_ref is a history key, not a unique one: re-authorizing mints a new connection carrying the same reference, so a lookup can return several rows and the first is the current one.


        Filter by `expires_before` (with `status=active`) to find the connections that need reconnecting. The `connect.connection.reconsent_required` webhook pushes the same signal one connection at a time and is the better fit for reacting to a lapse; this is for rendering state and for catching up after missed deliveries.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          maxLength: 200
          type: string
        in: query
        name: external_ref
        required: false
        description: Return only connections carrying this reference of yours, newest first.
      - schema:
          anyOf:
          - type: string
            enum:
            - pending
          - type: string
            enum:
            - active
          - type: string
            enum:
            - expired
          - type: string
            enum:
            - revoked
          - type: string
            enum:
            - error
        in: query
        name: status
        required: false
      - schema:
          format: date-time
          type: string
        in: query
        name: expires_before
        required: false
        description: Return only connections whose bank consent lapses before this instant. Combine with `status=active` to answer "which of my connections need reconnecting", which is otherwise only knowable by paging every row and comparing `consent_expires_at` yourself. Connections with no consent expiry (pending, or never activated) are excluded. An instant rather than a number of days, so your clock and ours cannot disagree about where the window ends.
      - schema:
          minimum: 1
          maximum: 500
          default: 100
          type: integer
        in: query
        name: limit
        required: false
        description: Rows per page. Defaults to 100, which is what this endpoint always returned.
      - schema:
          type: string
        in: query
        name: cursor
        required: false
        description: The `next_cursor` from your previous response.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - connections
                - next_cursor
                properties:
                  connections:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - external_ref
                      - applicant_ref
                      - mode
                      - aspsp_name
                      - country
                      - psu_type
                      - status
                      - consent_expires_at
                      - created_at
                      properties:
                        id:
                          format: uuid
                          type: string
                        external_ref:
                          anyOf:
                          - type: string
                          - type: 'null'
                        applicant_ref:
                          anyOf:
                          - type: string
                          - type: 'null'
                        mode:
                          description: 'Which access mode this connection is: `own` (your organization''s own accounts), `applicant` (your underwriting applicant''s), or `end_user` (the end user of an application you offer). Set at creation and never inferred.'
                          anyOf:
                          - type: string
                            enum:
                            - own
                          - type: string
                            enum:
                            - applicant
                          - type: string
                            enum:
                            - end_user
                        aspsp_name:
                          anyOf:
                          - type: string
                          - type: 'null'
                        country:
                          anyOf:
                          - type: string
                          - type: 'null'
                        psu_type:
                          anyOf:
                          - type: string
                            enum:
                            - business
                          - type: string
                            enum:
                            - personal
                        status:
                          anyOf:
                          - type: string
                            enum:
                            - pending
                          - type: string
                            enum:
                            - active
                          - type: string
                            enum:
                            - expired
                          - type: string
                            enum:
                            - revoked
                          - type: string
                            enum:
                            - error
                        failure_reason:
                          description: 'Why an attempt failed. **Present only when `status` is `error`**, and absent otherwise rather than null, because on a connection that did not fail the question does not apply. The four values need **different things from you**, which is the reason this field exists at all: `psu_denied`, the account holder declined or cancelled at their own bank, so invite them again; `no_code`, the bank returned them to us without an authorization code, which usually means they abandoned the screen, so invite them again; `code_exchange_failed`, our exchange with the bank failed after they authorized, which is ours to fix, so retry later rather than asking them again; `persist_failed`, the bank authorized and we could not store the result, also ours. **Treat this as an open enum**: switch on the values you know and have a default branch, because a new reason ships in `/v1` without a version bump. Nothing the bank or our provider said is published here, only our own verdict.'
                          anyOf:
                          - type: string
                            enum:
                            - psu_denied
                          - type: string
                            enum:
                            - no_code
                          - type: string
                            enum:
                            - code_exchange_failed
                          - type: string
                            enum:
                            - persist_failed
                        failure_kind:
                          description: 'A more specific account of why an attempt failed, alongside `failure_reason`. **Present only when `status` is `error`.** `failure_reason` is unchanged; this adds what it cannot say, where an error the bank returned during authorization is concerned: `bank_error`, the bank reported a problem of its own while the account holder was authorizing, which they did not cause, so invite them again a little later; `authorization_rejected`, the bank refused our authorization request as we made it, which is ours to fix, so contact us rather than asking them again; `authorization_failed`, the bank ended the attempt with an error we do not recognise, which can happen when the bank page is left open too long, so invite them again and tell us if it repeats; `psu_denied`, the account holder declined or cancelled. Each of those four arrives with `failure_reason: psu_denied`. For every other failure this repeats `failure_reason`. **An open enum**: switch on the values you know and keep a default branch.'
                          anyOf:
                          - type: string
                            enum:
                            - psu_denied
                          - type: string
                            enum:
                            - no_code
                          - type: string
                            enum:
                            - bank_error
                          - type: string
                            enum:
                            - authorization_rejected
                          - type: string
                            enum:
                            - authorization_failed
                          - type: string
                            enum:
                            - code_exchange_failed
                          - type: string
                            enum:
                            - persist_failed
                          - description: A kind added after your client was generated. Handle it in your default branch.
                            type: string
                        consent_expires_at:
                          anyOf:
