                  - id
                  - livemode
                  - url
                  - secret_prefix
                  - events
                  - status
                  - consecutive_failures
                  - created_at
                  - rotated_at
                  - last_delivered_at
                  properties:
                    id:
                      format: uuid
                      type: string
                    livemode:
                      description: false for an endpoint created with a test key. It receives events about test-mode activity only, and a live endpoint only live ones. Each mode has its own endpoints; neither key can see the other's.
                      type: boolean
                    url:
                      format: uri
                      type: string
                    secret_prefix:
                      type: string
                    events:
                      type: array
                      items:
                        type: string
                    status:
                      anyOf:
                      - type: string
                        enum:
                        - active
                      - type: string
                        enum:
                        - disabled
