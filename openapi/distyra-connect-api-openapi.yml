  /v1/connect/connections/{id}/transactions:
    get:
      operationId: getConnectionTransactions
      summary: Fetch normalized transactions for a connection
      tags:
      - Connect
      description: 'Transactions are fetched live from the bank on each call and never stored, so this is a pull API. Sync contract for keeping your own system up to date: on the first pull omit the date filters; on each later pull pass since= to fetch only from where you left off. The response always returns next_cursor (the end of the window just fetched). Poll on your own cadence and use it as the next since. Because the boundary day can overlap, deduplicate by each transaction''s id.


        **The first pull gets all the history the bank will give.** The first call on a connection without dates asks the bank for every transaction it will provide, and the response carries `history: "all"`. Banks differ: many give a year or more, but mostly only shortly after the account holder connects, and after that many give only 90 days. So make that first call soon after the connection activates. Be ready for it to return years of transactions, to take longer than a normal pull, and to use extra calls at the bank. Every later call without dates returns the last 90 days, unless the all-history answer came back `truncated`: that does not count as the first pull, so the next call without dates asks for all history again. To choose instead, send `history=recent` for the last 90 days (the first pull included) or `history=all` to ask for all history again. With `?enrich=true`, an all-history pull enriches only the last 90 days unless you also send `enrich_history=all`; older rows come back with `enrichment_skipped: true` and are not charged.


        **Every call with `enrich=true` is billed, including rows already enriched.** With a live key, each call counts every transaction it returns toward your enrichment usage, your free monthly allowance first and then your prepaid balance, including transactions an earlier call already enriched. Only rows marked `enrichment_skipped` or `enrichment_pending` are not counted. So store what you receive and fetch only new transactions with `since`, rather than fetching the same window again.


        **How often to poll.** A pull reuses the connection''s existing bank session, so it does not consume a new Active Session, and the pull itself is not metered (enrichment is, as above). The limit that binds is the PSD2 one: RTS (EU) 2018/389 Art. 36(5)(b) allows an account information service no more than four unattended accesses in a 24-hour period, unless a higher frequency is agreed with the bank, with your user''s consent. We enforce it for you: 4 unattended fetches per connection per UTC day, after which this endpoint answers 429 with a `resets_at`. A fetch that fails at the bank still counts. That is not a limit on your account, and stopping at it is what keeps the connection working for you and for everyone else on the platform. A fetch made while your own user is on screen is exempt under Art. 36(5)(a) and does not count. Polling harder does not get you data sooner either: a payment visible in the bank''s own app is not necessarily booked over PSD2 yet, and until it is, no number of calls will return it.


        **When the bank is down.** After a fetch for a connection times out at the bank or gets a server error, automated fetches for that connection are paused for five minutes: this endpoint answers 503 `bank_unavailable` at once, with a `Retry-After`, without contacting the bank or using a fetch from the allowance. So retrying into an outage does not use up the day. A fetch made while your user is on screen is not paused.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          type: string
        in: query
        name: account_id
        required: false
        description: EB account uid; omit to fetch all accounts on the connection.
      - schema:
          format: date
          type: string
        in: query
        name: since
        required: false
        description: 'Incremental cursor: the next_cursor from your previous response. Sets the window start when date_from is not given. Dedupe by transaction id across the boundary.'
      - schema:
          format: date
          type: string
        in: query
        name: date_from
        required: false
        description: Explicit window start (overrides since).
      - schema:
          format: date
          type: string
        in: query
        name: date_to
        required: false
      - schema:
          enum:
          - all
          - recent
          type: string
        in: query
        name: history
        required: false
        description: 'Which range a pull without dates reads. `all`: every transaction the bank will give, which may be years, slower, and use extra bank calls. `recent`: the last 90 days. When omitted, the first pull on a connection is `all` and every later one is `recent`. Cannot be combined with date_from or since; `all` cannot be combined with a date_to before today.'
      - schema:
          enum:
          - 'true'
          - 'false'
          type: string
        in: query
        name: enrich
        required: false
        description: 'Run enrichment on each transaction (needs enrichment:read). Billed on every call: with a live key, each returned transaction counts toward your enrichment usage, including transactions an earlier call already enriched, except rows marked `enrichment_skipped` or `enrichment_pending`. Store the results on your side rather than fetching the same window again. Enrichment may send transactions to our AI provider; see POST /v1/enrich.'
      - schema:
          enum:
          - all
          - recent
          type: string
        in: query
        name: enrich_history
        required: false
        description: 'With enrich=true on an all-history pull: `recent` (the default) enriches only the last 90 days and marks older rows `enrichment_skipped`, uncharged; `all` enriches and charges for every row. Other pulls enrich every row either way. Needs enrich=true.'
      - schema:
          enum:
          - 'true'
          - 'false'
          type: string
        in: query
        name: underwrite
        required: false
        description: Run the full underwriting analysis (enrichment always included; bills the per-applicant underwriting meter; needs underwriting:write). Returns the analysis bundle instead of transactions.
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      - schema:
          type: string
        in: header
        name: psu-ip-address
        required: false
        description: The IP address of your end user, when one is actively waiting on this call. Send with `Psu-User-Agent`; either both or neither. Never your own server's address.
      - schema:
          maxLength: 512
          type: string
        in: header
        name: psu-user-agent
        required: false
        description: The User-Agent of your end user's browser. Send with `Psu-Ip-Address`; either both or neither.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                properties:
                  date_from:
                    description: The start of the window read. On an all-history pull, the earliest booking date the bank returned, or null when it returned nothing.
                    anyOf:
                    - format: date
                      type: string
                    - type: 'null'
                  date_to:
                    format: date
                    type: string
                  history:
                    description: Present only when this pull asked the bank for all the history it will give, as the first pull without dates does. Absent means a dated or 90-day window.
                    type: string
                    enum:
                    - all
                  enriched_from:
                    description: 'With enrich=true. Rows booked before this date were not enriched or charged and carry `enrichment_skipped: true`. Null when every row was eligible.'
                    anyOf:
                    - format: date
                      type: string
                    - type: 'null'
                  enrichment_skipped_count:
                    description: 'With enrich=true. How many rows were deliberately not enriched because they fall before `enriched_from`. Not pending: calling again does not enrich them. Send enrich_history=all for that.'
                    type: integer
                  accounts_fetched:
                    description: How many accounts on this connection this answer covers. The account list is the one recorded when the holder authorised the connection, so if you know the connection has more accounts than this, the missing one never reached us and needs re-authorising.
                    type: integer
                  truncated:
                    description: 'Present only when the answer is partial: we stopped paginating at our own page ceiling rather than because the bank ran out, so there are more transactions in this window than are returned here. The ceiling applies to each account separately; `truncated_accounts` names the ones that hit it, and the other accounts are complete. Narrow the window with `date_from` / `date_to` and fetch again. Absent means complete. A truncated pull without dates does not use up the first pull: the next pull without dates asks for all history again.'
                    type: boolean
                    enum:
                    - true
                  truncated_accounts:
                    description: 'Present with `truncated`: the `account_id` of each account whose transactions were cut off at the page ceiling. Every other account in this answer is complete for the window.'
                    type: array
                    items:
                      type: string
                  next_cursor:
                    description: 'Pass as `since` on your next pull. The end of the window just fetched, so the boundary day can overlap: deduplicate by transaction id.'
                    anyOf:
                    - format: date
                      type: string
                    - type: 'null'
                  transactions:
                    type: array
                    items:
                      additionalProperties: true
                      type: object
                      required:
                      - account_id
                      - id
                      - id_source
                      - entry_reference
                      - transaction_id
                      - date
                      - booking_date
                      - value_date
                      - transaction_date
                      - amount
                      - currency
                      - descriptor
                      - counterparty_name
                      - counterparty_iban
                      - counterparty_bban
                      - remittance_information
                      - reference_number
                      - reference_number_scheme
                      - structured_reference
                      - credit_debit
                      - status
                      - pending
                      - mcc
                      - bank_code_description
                      - bank_code_codes
                      - bank_code_iso_pair
                      properties:
                        account_id:
                          description: 'Which account on this connection the entry belongs to, matching `account_id` from the accounts endpoint. Always present: every entry is fetched for one account and tagged with it.'
                          type: string
                        id:
                          description: 'The bank''s own reference for this entry: `entry_reference` when the bank sends one, else `transaction_id`. Safe to deduplicate on only when `id_source` is `entry_reference`; otherwise match on `date`, `amount` and `descriptor`.'
                          anyOf:
                          - type: string
                          - type: 'null'
                        id_source:
                          description: 'Which field `id` came from. `entry_reference` is unique and stable for the account. `transaction_id` is not: Enable Banking notes it may change when the list is fetched again. Null when the bank sent neither.'
                          anyOf:
                          - type: string
                            enum:
                            - entry_reference
                          - type: string
                            enum:
                            - transaction_id
                          - type: 'null'
                        entry_reference:
                          description: The bank's unique, stable reference for the entry on this account, as sent. Not unique across accounts.
                          anyOf:
                          - type: string
                          - type: 'null'
                        transaction_id:
                          description: The identifier the bank uses for fetching entry details, as sent. Not a stable reference.
                          anyOf:
                          - type: string
                          - type: 'null'
                        date:
                          description: 'YYYY-MM-DD. The booking date; where the bank sends none, the value date, and failing that the transaction date. Null only when the bank sends none of the three. A booked entry can appear a day or more after the money moved: a weekend credit is commonly visible in the bank''s own app before it is booked over PSD2, and until it is booked no amount of polling returns it.'
                          anyOf:
                          - format: date
                            type: string
                          - type: 'null'
                        booking_date:
                          description: YYYY-MM-DD. The date the bank booked the entry, when it sends one.
