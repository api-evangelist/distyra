      operationId: analyzeApplicantFromStatementAsyncStatus
      summary: Poll status + result of a submitted async PDF analysis
      tags:
      - underwriting
      description: 'Returns the current state of a job submitted to `POST /v1/underwrite/analyze/statement/async`. While `pending`/`running`, `result` is null. On `completed`, `result` holds the same payload the synchronous endpoint returns (features + evidence package + ids) and `analysis_id` is set. On `failed`, `error` carries the terminal reason. Rows (and their results) expire 7 days after submission.


        **Required scope:** `underwriting:read`.'
