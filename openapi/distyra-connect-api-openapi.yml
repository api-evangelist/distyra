  /v1/connect/hosted-link:
    post:
      operationId: createHostedConnectLink
      summary: Mint a hosted bank-connect link for an account holder
      tags:
      - Connect
      description: 'Returns a URL you send to whoever is connecting the account. Opening it starts the hosted pick-a-bank and consent flow, so you never handle bank credentials.


        Set `mode` to say whose account it is. For a product whose customers each connect their own bank (an accounting or bookkeeping SaaS, for example), that is `mode: ''end_user''` with your own `external_ref` to identify the customer and a `return_url` to land them back in your app. That combination needs no Underwriting subscription.


        `mode` and `applicant_ref` must agree: `applicant_ref` on its own still means an underwriting applicant, and sending it alongside a different `mode` is refused rather than guessed at. Omitting `mode` keeps the old inference, which resolves to `own` when no `applicant_ref` is present.


        The page shows the name, accent colour and logo your organization sets under Connect branding in the portal. `brand_name` and `brand_color` override the first two for one link. The logo is the image you upload there, served from our own servers so the account holder''s browser contacts no other site. It cannot be set per link: a request that sends `brand_logo_url` is refused with `brand_logo_url_unsupported`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              properties:
                country:
                  minLength: 2
                  maxLength: 2
                  type: string
                applicant_ref:
                  minLength: 1
                  maxLength: 200
                  type: string
                external_ref:
                  maxLength: 200
                  description: 'Your own stable id for the connection this link creates. Survives reconsent; echoed in list responses and every connect.connection.* webhook.


                    Use a pseudonymous id, meaningful only inside your own systems. Do not put a name, email address or other directly identifying detail here: we cannot tell one from the other, we store what you send, and you are the controller for it. We erase it when your organization is deleted, and billing records reference the connection rather than this value so the erasure holds.


                    **Required scope:** `connect:write`.'
                  type: string
                mode:
                  description: 'Whose account the link is for. Same rules as POST /v1/connect/connections: omit and we infer from applicant_ref, send `end_user` for a user of your own application. Signed into the link, so the connection it creates carries the mode you asked for. If a mode is not available for your organization, the request is refused with `connect_mode_unavailable`. When business verification is required, a live `end_user` link is checked when it is minted and again when it is used.'
                  anyOf:
                  - type: string
                    enum:
                    - own
                  - type: string
                    enum:
                    - applicant
                  - type: string
                    enum:
                    - end_user
                brand_name:
                  maxLength: 60
                  description: Override the hosted page brand name for this link (defaults to your org branding).
                  type: string
                brand_color:
                  description: Override brand accent colour (#RRGGBB) for this link.
                  type: string
                return_url:
                  format: uri
                  type: string
                psu_type:
                  default: business
                  description: Whether the account to connect is a business or a personal one. The hosted page opens with this choice and lists the banks that offer that type of account; the account holder can change it there, since they are the one who knows. Defaults to `business`.
                  anyOf:
                  - type: string
                    enum:
                    - business
                  - type: string
                    enum:
                    - personal
                expires_in_hours:
                  minimum: 1
                  maximum: 168
                  default: 72
                  description: 'How long the link stays usable, in hours. Defaults to 72, capped at 7 days.


                    This bounds when the account holder may **start**, not when they may finish. Once they have chosen their bank, the flow runs on that bank''s clock, and an authorization begun just before the link expired will still activate the connection when it completes. So do not treat `expires_at` as the moment an attempt dies: to clean up attempts that never finished, measure age from the connection''s own `created_at` (which is when the authorization began) and send `expected_status=pending` on the delete.'
                  type: integer
