  /v1/connect/connections:
    post:
      operationId: createConnection
      summary: Open a bank connection (returns the authorization URL)
      tags:
      - Connect
      description: 'Opens a PSD2/AIS connection and returns the bank authorization URL to send the account holder to. The connection is `pending` until they finish authorizing at their bank, at which point it flips to `active` and a `connect.connection.activated` webhook fires. `aspsp_name` must be an exact name from GET /v1/connect/aspsps.


        **Required scope:** `connect:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - country
              - aspsp_name
              properties:
                country:
                  minLength: 2
                  maxLength: 2
                  description: ISO-2 country code, e.g. DE.
                  type: string
                aspsp_name:
                  minLength: 1
                  description: Bank name; resolved to the canonical Enable Banking ASPSP name.
                  type: string
                applicant_ref:
                  minLength: 1
                  maxLength: 200
                  description: 'Your reference for the underwriting applicant/deal. Sending it selects `mode: ''applicant''` and needs an Underwriting subscription. Must be non-empty when present.


                    This names a deal, not a person you do business with. If you are connecting the accounts of users of your own product, leave this out and send `mode: ''end_user''` with `external_ref` instead; if the accounts are your organization’s own, leave both out. It is the only field here that reads like a customer id, which is why it is the one most often reached for by mistake.


                    Use a pseudonymous id, meaningful only inside your own systems. Do not put a name, email address or other directly identifying detail here: we cannot tell one from the other, we store what you send, and you are the controller for it. We erase it when your organization is deleted, and billing records reference the connection rather than this value so the erasure holds.'
                  type: string
                external_ref:
                  maxLength: 200
                  description: 'Your own stable id for this connection (e.g. your user or account id). Unlike the connection id, it survives reconsent: pass the same value when a customer re-authorizes and key your integration off it. Echoed in list responses and every connect.connection.* webhook.


                    Use a pseudonymous id, meaningful only inside your own systems. Do not put a name, email address or other directly identifying detail here: we cannot tell one from the other, we store what you send, and you are the controller for it. We erase it when your organization is deleted, and billing records reference the connection rather than this value so the erasure holds.'
                  type: string
                mode:
                  description: 'Whose account this is. `own` (your organization''s own, the default), `applicant` (your underwriting applicant''s, equivalent to sending applicant_ref), or `end_user` (a user of an application you offer). Omit and we infer it from applicant_ref, which is what every existing integration does. Send it explicitly for `end_user`: nothing else distinguishes a user of your product from an account you hold yourself, and the difference decides the consent window, the reconsent email and who we say the account belongs to.


                    If a mode is not available for your organization, the request is refused with `connect_mode_unavailable`.


                    When business verification is required for live `end_user` connections, an unverified organization is refused with `business_verification_required`, or `business_verification_pending` while a check is still running. You verify once in the portal under Connect.'
                  anyOf:
                  - type: string
                    enum:
                    - own
                  - type: string
                    enum:
                    - applicant
                  - type: string
                    enum:
                    - end_user
                return_url:
                  format: uri
                  description: 'Where to send the account holder after consent. Defaults to a Distyra-hosted page. Required when `mode` is `end_user`: that person is inside your product and must be returned to it, not left on a page of ours telling them to close the window.'
                  type: string
                psu_type:
                  default: business
                  description: 'Whether the account holder is a business or a private individual. Must match the `psu_type` you listed the bank under in GET /v1/connect/aspsps: banks are registered per type and a name from the personal list is not resolvable as a business one. Sole traders and freelancers routinely run a business on a personal account, so this is not a statement about who your customer is, it is which registration to use. Defaults to `business`.'
                  anyOf:
                  - type: string
                    enum:
                    - business
                  - type: string
                    enum:
                    - personal
