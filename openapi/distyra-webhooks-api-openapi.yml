  /v1/webhook_endpoints/{id}/rotate_secret:
    post:
      operationId: rotateWebhookEndpointSecret
      summary: Generate a new signing secret for an existing endpoint
      tags:
      - Webhooks
      description: 'The new secret takes effect immediately on the next delivery. Customers must update their verifier before this call lands; rotate in a maintenance window or accept brief signature mismatches during the cutover.


        **Required scope:** `webhooks:write`.'
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
