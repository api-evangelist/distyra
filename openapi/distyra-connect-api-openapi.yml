  /v1/connect/connections/{id}:
    get:
      operationId: getConnection
      summary: Read a bank connection
      tags:
      - Connect
      description: 'Current status of one connection, including consent expiry. Poll this after sending the account holder to the authorization URL, or subscribe to the `connect.connection.*` webhook events instead of polling. Read with a key of the connection''s mode: a sandbox connection with a test key, a live one with a live key.


        **Required scope:** `connect:read`.'
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - external_ref
                - applicant_ref
                - mode
                - aspsp_name
                - country
                - psu_type
                - status
                - consent_expires_at
                - created_at
                properties:
                  id:
                    format: uuid
                    type: string
                  external_ref:
                    anyOf:
                    - type: string
                    - type: 'null'
                  applicant_ref:
                    anyOf:
                    - type: string
                    - type: 'null'
                  mode:
                    description: 'Which access mode this connection is: `own` (your organization''s own accounts), `applicant` (your underwriting applicant''s), or `end_user` (the end user of an application you offer). Set at creation and never inferred.'
                    anyOf:
                    - type: string
                      enum:
                      - own
                    - type: string
                      enum:
                      - applicant
                    - type: string
                      enum:
                      - end_user
                  aspsp_name:
                    anyOf:
                    - type: string
                    - type: 'null'
                  country:
                    anyOf:
                    - type: string
                    - type: 'null'
                  psu_type:
                    anyOf:
                    - type: string
                      enum:
                      - business
                    - type: string
                      enum:
                      - personal
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - pending
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - expired
                    - type: string
                      enum:
                      - revoked
                    - type: string
                      enum:
                      - error
                  failure_reason:
                    description: 'Why an attempt failed. **Present only when `status` is `error`**, and absent otherwise rather than null, because on a connection that did not fail the question does not apply. The four values need **different things from you**, which is the reason this field exists at all: `psu_denied`, the account holder declined or cancelled at their own bank, so invite them again; `no_code`, the bank returned them to us without an authorization code, which usually means they abandoned the screen, so invite them again; `code_exchange_failed`, our exchange with the bank failed after they authorized, which is ours to fix, so retry later rather than asking them again; `persist_failed`, the bank authorized and we could not store the result, also ours. **Treat this as an open enum**: switch on the values you know and have a default branch, because a new reason ships in `/v1` without a version bump. Nothing the bank or our provider said is published here, only our own verdict.'
                    anyOf:
                    - type: string
                      enum:
                      - psu_denied
                    - type: string
                      enum:
                      - no_code
                    - type: string
                      enum:
                      - code_exchange_failed
                    - type: string
                      enum:
                      - persist_failed
                  failure_kind:
                    description: 'A more specific account of why an attempt failed, alongside `failure_reason`. **Present only when `status` is `error`.** `failure_reason` is unchanged; this adds what it cannot say, where an error the bank returned during authorization is concerned: `bank_error`, the bank reported a problem of its own while the account holder was authorizing, which they did not cause, so invite them again a little later; `authorization_rejected`, the bank refused our authorization request as we made it, which is ours to fix, so contact us rather than asking them again; `authorization_failed`, the bank ended the attempt with an error we do not recognise, which can happen when the bank page is left open too long, so invite them again and tell us if it repeats; `psu_denied`, the account holder declined or cancelled. Each of those four arrives with `failure_reason: psu_denied`. For every other failure this repeats `failure_reason`. **An open enum**: switch on the values you know and keep a default branch.'
                    anyOf:
                    - type: string
                      enum:
                      - psu_denied
                    - type: string
                      enum:
                      - no_code
                    - type: string
                      enum:
                      - bank_error
                    - type: string
                      enum:
                      - authorization_rejected
                    - type: string
                      enum:
                      - authorization_failed
                    - type: string
                      enum:
                      - code_exchange_failed
                    - type: string
                      enum:
                      - persist_failed
                    - description: A kind added after your client was generated. Handle it in your default branch.
                      type: string
                  consent_expires_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                  created_at:
                    format: date-time
                    type: string
                  data_caveats:
                    description: What this bank does not send, when we know something specific about it. Same field and same meaning as on GET /v1/connect/aspsps, repeated here so it is available after the connection is open and not only while choosing. Absent is not a grade.
                    type: object
                    properties:
                      no_transaction_type:
                        description: 'This bank has not sent a transaction code or a description in the traffic we have seen from it, so expect `transaction_type` to be null. Nothing to retry: it changes if the bank starts sending it.'
                        type: boolean
                        enum:
                        - true
                      sparse_counterparty_name:
                        description: This bank has typically left the counterparty name off a meaningful share of entries. Those fall back to whatever reference text the bank sends, which is weaker to identify a merchant from than a payee name, so expect more of them to come back unresolved.
                        type: boolean
                        enum:
                        - true
                      no_counterparty_text:
                        description: 'Stronger than `sparse_counterparty_name` and never sent alongside it. This bank has sent neither a counterparty name nor remittance text on a meaningful share of entries, so expect some rows to carry no text at all: a date, an amount and nothing to identify. Those cannot be enriched by anyone.'
                        type: boolean
                        enum:
                        - true
                      observed_through:
                        format: date
                        description: 'The newest traffic behind the three sparseness flags above, as a date. Present whenever any of them is, absent otherwise, and it does **not** describe `beta`, which comes from the live connector record rather than from observed traffic. Read it as a weight on the claim rather than as decoration: these flags come from a periodic sample of what connectors have sent, so a flag dated some months back may describe a bank that has since started sending the field. The strongest flag is the one most exposed to this, because `no_transaction_type` rests on having seen no code at all, and never having observed one is not the same as the bank not sending one. If a date here is old and the distinction matters to you, ask us to re-check that bank rather than designing around it.'
                        type: string
