  /v1/underwrite/analyses:
    get:
      operationId: listUnderwritingAnalyses
      summary: List past underwriting analyses (billing transparency)
      tags:
      - underwriting
      description: 'Paginated list of analyses for the calling organization, ordered by `created_at DESC, id DESC`. Returns metadata only. Features payloads are accessed via GET /v1/underwrite/analyses/:id within the 7-day window.


        **Pagination.** Cursor-based: pass back `next_cursor` from the previous response in the `cursor` query parameter. `next_cursor` is null on the last page. Cursors are stable across rows that share a `created_at` (id breaks ties).


        **Filtering.** Optional `applicant_id` exact-match filter. Combine with `limit` for typical "show me this applicant''s analysis history" queries.


        **Use cases.** Billing transparency, applicant history, post-purge audit (rows show `features_purged: true` once the 7-day window elapses).


        Required scope: `underwriting:read`.'
      parameters:
      - schema:
          minimum: 1
          maximum: 200
          default: 50
          type: integer
        examples:
          '50':
            value: 50
          '200':
            value: 200
        in: query
        name: limit
        required: false
        description: Maximum items to return on this page. Server may return fewer if there is no more data.
      - schema:
          type: string
        example: 2026-05-12T14%3A02%3A11.412Z%7C8814f3b2-2c54-46e7-bf2b-2a6f57e3d4f3
        in: query
        name: cursor
        required: false
        description: 'Opaque pagination cursor returned in `next_cursor` of the previous response. Format: `<iso-timestamp>|<uuid>` (clients should treat it as opaque).'
      - schema:
          minLength: 1
          maxLength: 256
          type: string
        example: loan_app_42
        in: query
        name: applicant_id
        required: false
        description: Filter to a single applicant_id. Exact-match only.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Page of past analyses for billing transparency. Scoped to your organization; only your organization's rows are visible.
          content:
            application/json:
              schema:
                description: Page of past analyses for billing transparency. Scoped to your organization; only your organization's rows are visible.
                type: object
                required:
                - items
                - next_cursor
                properties:
                  items:
                    type: array
                    items:
                      description: Metadata-only row. The features payload is deliberately left out. Re-fetch via GET /v1/underwrite/analyses/:id within the 7-day window.
                      type: object
                      required:
                      - id
                      - applicant_id
                      - applicant_ref
                      - created_at
                      - billable
                      - billed_amount_micros
                      - input_mode
                      - account_count
                      - transaction_count
                      - features_purged
                      properties:
                        id:
                          format: uuid
                          type: string
                        applicant_id:
                          type: string
                        applicant_ref:
                          description: The lender's own reference for Distyra Connect analyses, joined from the originating connection. For connect-originated analyses `applicant_id` is the connection id (the data-source identity used for idempotency), and this is the human reference the lender set on the connection. null for direct JSON /analyze submissions, where the lender's reference is already `applicant_id`.
                          anyOf:
                          - type: string
                          - type: 'null'
                          example: loan_app_42
                        created_at:
                          format: date-time
                          type: string
                        billable:
                          description: false for 7-day idempotent re-pulls and for calls within the included-quota tier.
                          type: boolean
                        billed_amount_micros:
                          description: Stringified bigint (micro-EUR). The per-applicant underwriting charge for this analyze call (enrichment performed inside the call is included in the per-applicant rate, never a second component).
                          type: string
                          example: '5000000'
                        input_mode:
                          type: string
                          example: enriched
                        account_count:
                          type: integer
                          example: 1
                        transaction_count:
                          type: integer
                          example: 142
                        features_purged:
                          description: true if the features payload has been wiped by the 7-day retention purge. GET /v1/underwrite/analyses/:id returns 410 for these.
                          type: boolean
                  next_cursor:
                    description: Opaque cursor for the next page. Null when there are no more rows. Pass back via the `cursor` query parameter to fetch the next page.
                    anyOf:
                    - type: string
                    - type: 'null'
