  /v1/webhook_endpoints/{id}:
    get:
      operationId: getWebhookEndpoint
      summary: Get a single webhook endpoint
      tags:
      - Webhooks
      description: 'One webhook endpoint, with its subscribed events and status. The signing secret is not included; it is shown once at creation and once per rotation.


        **Required scope:** `webhooks:read`.'
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - livemode
                - url
                - secret_prefix
                - events
                - status
                - consecutive_failures
                - created_at
                - rotated_at
                - last_delivered_at
                properties:
                  id:
                    format: uuid
                    type: string
                  livemode:
                    description: false for an endpoint created with a test key. It receives events about test-mode activity only, and a live endpoint only live ones. Each mode has its own endpoints; neither key can see the other's.
                    type: boolean
