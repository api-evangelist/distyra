  /v1/underwrite/feedback:
    post:
      operationId: submitUnderwritingFeedback
      summary: Submit corrections for a previous underwriting analysis
      tags:
      - underwriting
      description: '**Free.** Not metered, no balance debit, no ledger entry. Captures analyst corrections against a prior `/v1/underwrite/analyze` result.


        **Auto-apply for your organization.** Corrections whose `corrected_payload` contains a `(counterparty_iban, counterparty_role)` pair are applied as overrides for your organization. Subsequent analyses then see the overridden role; useful when the shared catalog has misclassified a counterparty for your use case.


        **No automatic promotion.** Corrections never automatically flow to the shared catalog; that path stays operator-gated. This preserves the controller/processor separation.


        **Survives 7-day analysis purge.** The `analysis_id` foreign key may become null after retention purge, but the correction row itself stays for operator review.


        **Identification.** Pass `analysis_id` while the row exists (preferred); fall back to `applicant_id` if the analysis has been purged. Scoped to your organization; an `analysis_id` belonging to another organization returns 404.


        Required scope: `underwriting:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: At least one of analysis_id or applicant_id is required. When both are provided, analysis_id wins and applicant_id is resolved from the row.
              type: object
              required:
              - corrections
              properties:
                analysis_id:
                  format: uuid
                  description: Preferred when the analysis row still exists. Scoped to your organization; a uuid that does not belong to your organization returns 404 (no information leakage).
                  type: string
                applicant_id:
                  minLength: 1
                  maxLength: 256
                  description: Fallback identifier when the analysis row has been purged (>7 days) or when feedback arrives without a known analysis_id.
                  type: string
                  example: loan_app_42
                corrections:
                  minItems: 1
                  maxItems: 100
                  description: At least one correction is required. Each entry is durably recorded; corrections with a valid (counterparty_iban, counterparty_role) payload additionally update your counterparty-role overrides.
                  type: array
                  items:
                    type: object
                    required:
                    - feature_path
                    - correction_type
                    properties:
                      feature_path:
                        minLength: 1
                        maxLength: 512
                        description: Dotted path to the feature being corrected, e.g. "counterparty.tax_payments.0" or "recurring.recurring_revenue.2.cadence". Stored verbatim, because the operator review UI parses it.
                        type: string
                        example: counterparty.tax_payments.0
                      correction_type:
                        description: '''false_positive'' = the row/value should not be there. ''wrong_value'' = present but wrong; corrected_payload carries the right value. ''missing_value'' = a feature row is missing; corrected_payload describes what should be added.'
                        anyOf:
                        - type: string
                          enum:
                          - false_positive
                        - type: string
                          enum:
                          - wrong_value
                        - type: string
                          enum:
                          - missing_value
                        example: wrong_value
                      corrected_payload:
                        additionalProperties: true
                        description: Free-form payload describing the corrected value. For automatic counterparty-role overrides scoped to your organization, include `counterparty_iban` (string) and `counterparty_role` (one of tax_authority, lender, customer, supplier, employee, payment_processor, internal_transfer). Such (iban, role) pairs are applied to your subsequent analyses.
                        type: object
                        properties: {}
                        example:
                          counterparty_iban: DE89370400440532013000
                          counterparty_role: lender
                      analyst_note:
                        maxLength: 2048
                        description: Optional free-text context. Captured for operator review; not surfaced back to the analyst on retrieval.
                        type: string
                        example: this is rent, paid first of every month
            example:
              analysis_id: 8814f3b2-2c54-46e7-bf2b-2a6f57e3d4f3
              corrections:
              - feature_path: counterparty.debt_service
                correction_type: missing_value
                corrected_payload:
                  counterparty_iban: GB29NWBK60161331926819
                  counterparty_role: lender
                analyst_note: monthly loan repayment to iwoca was missed
        description: At least one of analysis_id or applicant_id is required. When both are provided, analysis_id wins and applicant_id is resolved from the row.
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Acknowledgement of a feedback batch. Free (not metered).
          content:
            application/json:
              schema:
                description: Acknowledgement of a feedback batch. Free (not metered).
                type: object
                required:
                - accepted_count
                - correction_ids
                - overrides_applied
                - queued_for_review
                properties:
                  accepted_count:
                    description: Number of corrections persisted to the queue. Equals corrections.length on success.
                    type: integer
                    example: 1
                  correction_ids:
                    description: Server-assigned ids for each persisted correction (same order as the request `corrections` array).
                    type: array
                    items:
                      format: uuid
                      type: string
                  overrides_applied:
                    description: Number of (iban, role) pairs that were applied as counterparty-role overrides for your organization. Always ≤ corrections.length; corrections without a valid (counterparty_iban, counterparty_role) payload are still durably recorded but do not produce an automatic override.
                    type: integer
                    example: 1
                  queued_for_review:
                    description: Always true in v1. Every correction is queued for operator review in the admin UI. Reserved for future "auto-applied, no review needed" paths.
                    type: boolean
        '400':
          description: Standard error envelope used for all non-2xx responses.
