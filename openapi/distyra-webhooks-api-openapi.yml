    patch:
      operationId: updateWebhookEndpoint
      summary: Update a webhook endpoint (url, events, status)
      tags:
      - Webhooks
      description: 'Partial update. Provide any subset of url, events, status. `events` fully replaces the subscription list. Setting status=active clears the failure counter and re-enables an auto-disabled endpoint. The signing secret is unchanged. Use rotate_secret for that.


        **Required scope:** `webhooks:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              minProperties: 1
              type: object
              properties:
                url:
                  format: uri
                  pattern: ^https://
                  description: New HTTPS URL. Plain HTTP rejected.
                  type: string
                events:
                  minItems: 1
                  description: Replacement event subscription list (full replace, not merge).
                  type: array
                  items:
                    anyOf:
                    - type: string
                      enum:
                      - batch.completed
                    - type: string
                      enum:
                      - batch.failed
                    - type: string
                      enum:
                      - analysis.completed
                    - type: string
                      enum:
                      - ingestion.completed
                    - type: string
                      enum:
                      - connect.connection.activated
                    - type: string
                      enum:
                      - connect.connection.reconsent_required
                    - type: string
                      enum:
                      - connect.connection.expired
                    - type: string
                      enum:
                      - connect.connection.revoked
                    - type: string
                      enum:
                      - connect.connection.error
                status:
                  description: Set 'disabled' to pause deliveries, 'active' to resume (also clears the failure counter).
                  anyOf:
                  - type: string
                    enum:
                    - active
                  - type: string
                    enum:
                    - disabled
      parameters:
      - schema:
          format: uuid
          type: string
        in: path
        name: id
        required: true
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - livemode
                - url
                - secret_prefix
                - events
                - status
                - consecutive_failures
                - created_at
                - rotated_at
                - last_delivered_at
                properties:
                  id:
                    format: uuid
                    type: string
                  livemode:
                    description: false for an endpoint created with a test key. It receives events about test-mode activity only, and a live endpoint only live ones. Each mode has its own endpoints; neither key can see the other's.
                    type: boolean
                  url:
                    format: uri
                    type: string
                  secret_prefix:
                    type: string
                  events:
                    type: array
                    items:
                      type: string
                  status:
                    anyOf:
                    - type: string
                      enum:
                      - active
                    - type: string
                      enum:
                      - disabled
                    - type: string
                      enum:
                      - auto_disabled
                  consecutive_failures:
                    type: integer
                  created_at:
                    format: date-time
                    type: string
                  rotated_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
                  last_delivered_at:
                    anyOf:
                    - format: date-time
                      type: string
                    - type: 'null'
