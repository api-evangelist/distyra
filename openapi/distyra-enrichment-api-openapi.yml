                                - type: 'null'
                              message:
                                description: 'A short human-readable sentence you can surface to a user, or null. Populated only where `status` alone cannot convey what to do about it: today that is rate_limited, where it says what is degraded and how long for. `status` remains the machine-readable contract; do not branch on this string.'
