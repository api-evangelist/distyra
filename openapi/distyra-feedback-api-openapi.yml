  /v1/feedback/confirmation:
    post:
      operationId: submitConfirmation
      summary: Confirm a previously-enriched transaction was correct
      tags:
      - Feedback
      description: 'Positive feedback signal that strengthens confidence in the (descriptor, merchant) tuple. Aggregated into the confidence weighting for that merchant. Re-submitting is allowed and additive (each call counts as one signal).


        **Required scope:** `feedback:write`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - descriptor
              properties:
                descriptor:
                  minLength: 1
                  maxLength: 1024
                  description: The original transaction descriptor as passed to /v1/enrich.
                  type: string
                confirmed_merchant_id:
                  minimum: 1
                  description: Catalog id of the merchant whose enrichment is being confirmed. Omit to confirm a "no merchant resolved" decision (e.g. /v1/enrich correctly identified this as a bank fee).
                  type: integer
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Default Response
          content:
            application/json:
              schema:
                type: object
                required:
                - id
